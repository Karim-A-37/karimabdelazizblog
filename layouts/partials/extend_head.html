<link rel="icon" type="image/png" href="/favicon.png" />
<link rel="apple-touch-icon" href="/favicon.png" />
<meta name="theme-color" content="#1a1a2e" />

<style>
/* ══════════════════════════════════════════════
   Hanging katana chain — positioned UNDER the
   .logo element, spanning its full width
   ══════════════════════════════════════════════ */
.ka-chain-wrap {
  pointer-events: none;
  position: absolute;
  top: 100%;
  left: 0;
  width: 100%;
  height: 80px;
  z-index: 20;
  overflow: visible;
}

/* The thin horizontal rope/chain line */
.ka-chain-wire {
  position: absolute;
  top: 0;
  left: 0;
  right: 0;
  height: 1px;
  background: linear-gradient(
    90deg,
    transparent 0%,
    rgba(34,197,94,0.5) 10%,
    rgba(34,197,94,0.35) 50%,
    rgba(34,197,94,0.5) 90%,
    transparent 100%
  );
}

/* Individual hanging katana container */
.ka-pend {
  position: absolute;
  top: 0;
  width: 20px;
  height: 70px;
  transform-origin: 50% 0;
  animation: ka-sway 2.4s ease-in-out infinite alternate;
}

/* Stagger each katana's swing */
.ka-pend:nth-child(1)  { animation-delay:  0.00s; left:  6%; }
.ka-pend:nth-child(2)  { animation-delay: -0.28s; left: 20%; }
.ka-pend:nth-child(3)  { animation-delay: -0.55s; left: 35%; }
.ka-pend:nth-child(4)  { animation-delay: -0.82s; left: 50%; }
.ka-pend:nth-child(5)  { animation-delay: -1.10s; left: 65%; }
.ka-pend:nth-child(6)  { animation-delay: -1.38s; left: 80%; }
.ka-pend:nth-child(7)  { animation-delay: -0.70s; left: 93%; }

@keyframes ka-sway {
  0%   { transform: rotate(-11deg); }
  100% { transform: rotate( 11deg); }
}

/* The rope thread */
.ka-rope {
  position: absolute;
  top: 0;
  left: 50%;
  width: 1px;
  height: 12px;
  background: rgba(34,197,94,0.5);
  transform: translateX(-50%);
}

/* The SVG katana blade */
.ka-pend svg {
  position: absolute;
  top: 10px;
  left: 50%;
  transform: translateX(-50%);
  width: 18px;
  height: 56px;
  overflow: visible;
  filter: drop-shadow(0 0 3px rgba(34,197,94,0.55));
  opacity: 0.85;
}

/* ── Theme toggle pulse ─────────────────────────────── */
#theme-toggle { transition: transform 0.2s ease; }
#theme-toggle:active { transform: scale(0.88); }
@keyframes ka-shield-pulse {
  0%   { box-shadow: 0 0 0 0    rgba(34,197,94,0.55); }
  70%  { box-shadow: 0 0 0 10px rgba(34,197,94,0); }
  100% { box-shadow: 0 0 0 0    rgba(34,197,94,0); }
}
#theme-toggle.ka-pulsing {
  animation: ka-shield-pulse 0.5s ease;
  border-radius: 6px;
}
</style>

<script>
/* ── Theme toggle pulse ──────────────────── */
document.addEventListener('click', function(e) {
  var btn = e.target.closest('#theme-toggle');
  if (!btn) return;
  btn.classList.remove('ka-pulsing');
  void btn.offsetWidth;
  btn.classList.add('ka-pulsing');
  btn.addEventListener('animationend', function() {
    btn.classList.remove('ka-pulsing');
  }, { once: true });
});

/* ── Inject katana chain UNDER logo ─────── */
document.addEventListener('DOMContentLoaded', function () {
  var logo = document.querySelector('.logo');
  if (!logo || document.getElementById('ka-chain-wrap')) return;

  /* Make .logo relatively positioned so we can absolute-position under it */
  logo.style.position = 'relative';

  /* One mini-katana SVG template (pointing downward, green) */
  function makeSwordSVG() {
    return [
      '<svg viewBox="0 0 20 58" fill="none" xmlns="http://www.w3.org/2000/svg">',
        '<defs>',
          '<linearGradient id="kg" x1="0" y1="0" x2="0" y2="1">',
            '<stop offset="0%" stop-color="#b9ffd0"/>',
            '<stop offset="70%" stop-color="#22c55e"/>',
            '<stop offset="100%" stop-color="transparent"/>',
          '</linearGradient>',
        '</defs>',
        /* Blade */
        '<polygon points="8,18 12,18 10,54" fill="url(#kg)"/>',
        /* Blade tip highlight */
        '<polygon points="9.5,18 12,18 10,54" fill="rgba(255,255,255,0.15)"/>',
        /* Blade edge */
        '<line x1="12" y1="18" x2="10" y2="54" stroke="rgba(255,255,255,0.3)" stroke-width="0.5"/>',
        /* Guard (tsuba) */
        '<ellipse cx="10" cy="19" rx="8" ry="2.5" fill="#22c55e" opacity="0.9"/>',
        '<ellipse cx="10" cy="19" rx="5" ry="1.5" fill="#4ade80" opacity="0.5"/>',
        /* Handle */
        '<rect x="7.5" y="2" width="5" height="16" rx="2" fill="#15803d"/>',
        /* Handle wrap cross-lines */
        '<line x1="7.5" y1="6"  x2="12.5" y2="8"  stroke="#4ade80" stroke-width="0.8" opacity="0.7"/>',
        '<line x1="7.5" y1="10" x2="12.5" y2="12" stroke="#4ade80" stroke-width="0.8" opacity="0.7"/>',
        '<line x1="7.5" y1="14" x2="12.5" y2="16" stroke="#4ade80" stroke-width="0.8" opacity="0.7"/>',
        /* Pommel */
        '<ellipse cx="10" cy="2" rx="4" ry="2" fill="#22c55e" opacity="0.8"/>',
      '</svg>'
    ].join('');
  }

  /* Build the chain wrap */
  var wrap = document.createElement('div');
  wrap.id = 'ka-chain-wrap';
  wrap.className = 'ka-chain-wrap';
  wrap.setAttribute('aria-hidden', 'true');

  /* Wire */
  var wire = document.createElement('div');
  wire.className = 'ka-chain-wire';
  wrap.appendChild(wire);

  /* 7 katanas */
  for (var i = 0; i < 7; i++) {
    var pend = document.createElement('div');
    pend.className = 'ka-pend';
    var rope = document.createElement('div');
    rope.className = 'ka-rope';
    pend.appendChild(rope);
    pend.innerHTML += makeSwordSVG();
    wrap.appendChild(pend);
  }

  logo.appendChild(wrap);
});
</script>
