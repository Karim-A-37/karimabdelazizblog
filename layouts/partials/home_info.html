{{- with site.Params.homeInfoParams }}
<style>
/* ── Hero ─────────────────────────────────────────────────── */
.home-hero {
  padding: 2.5rem 0 1.5rem;
  border-bottom: 1px solid var(--border);
  margin-bottom: 2rem;
}
.home-hero__eyebrow {
  display: inline-flex;
  align-items: center;
  gap: 0.4rem;
  font-size: 0.7rem;
  font-weight: 700;
  letter-spacing: 0.12em;
  text-transform: uppercase;
  color: #22c55e;
  margin-bottom: 0.8rem;
}
.home-hero__dot {
  width: 6px; height: 6px;
  background: #22c55e;
  border-radius: 50%;
  animation: pulse-dot 2s infinite;
}
@keyframes pulse-dot {
  0%,100% { opacity: 1; }
  50%      { opacity: 0.3; }
}
.home-hero__name {
  font-size: clamp(2rem, 5vw, 3rem);
  font-weight: 900;
  margin: 0 0 0.4rem;
  letter-spacing: -0.02em;
  line-height: 1.1;
}
.home-hero__typing-wrap {
  font-size: clamp(1rem, 2.5vw, 1.2rem);
  color: var(--secondary);
  margin: 0 0 1.2rem;
  min-height: 1.6em;
}
.home-hero__cursor {
  display: inline-block;
  width: 2px;
  height: 1.1em;
  background: #22c55e;
  margin-left: 2px;
  vertical-align: middle;
  animation: blink 0.8s step-end infinite;
}
@keyframes blink { 0%,100%{opacity:1} 50%{opacity:0} }

.home-hero__socials { margin-bottom: 1.8rem; }

</style>

<div class="home-hero">
  <div class="home-hero__eyebrow">
    <span class="home-hero__dot"></span>
    Open to opportunities · Jun 2026
  </div>
  <h1 class="home-hero__name">Karim Abdelaziz</h1>
  <div class="home-hero__typing-wrap">
    <span id="hero-typed"></span><span class="home-hero__cursor"></span>
  </div>
  <div class="home-hero__socials">
    {{ partial "social_icons.html" (dict "align" site.Params.homeInfoParams.AlignSocialIconsTo) }}
  </div>

</div>

<script>
(function(){
  var phrases = [
    "Cybersecurity Student",
    "Penetration Testing Learner",
    "SIEM & XDR Builder",
    "CTF Player",
    "Red Team Aspirant"
  ];
  var el = document.getElementById("hero-typed");
  if (!el) return;
  var pi = 0, ci = 0, deleting = false, wait = 0;
  function tick() {
    var phrase = phrases[pi];
    if (!deleting) {
      ci++;
      el.textContent = phrase.slice(0, ci);
      if (ci === phrase.length) { deleting = true; wait = 28; }
    } else {
      if (wait-- > 0) { setTimeout(tick, 60); return; }
      ci--;
      el.textContent = phrase.slice(0, ci);
      if (ci === 0) { deleting = false; pi = (pi+1) % phrases.length; wait = 0; }
    }
    setTimeout(tick, deleting ? 38 : 68);
  }
  tick();
})();
</script>
{{- end -}}
