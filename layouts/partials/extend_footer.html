{{- /* Reading progress bar + TOC scroll-spy + mobile TOC button */ -}}

{{- /* ── 1. Reading progress bar (all single pages) ─────────────────── */ -}}
{{ if .IsPage }}
<style>
#reading-progress {
  position: fixed;
  top: 0; left: 0;
  height: 3px;
  width: 0%;
  background: #22c55e;
  z-index: 9999;
  transition: width 0.08s linear;
  border-radius: 0 2px 2px 0;
  box-shadow: 0 0 8px rgba(34,197,94,0.5);
}
/* Mobile TOC floating button */
#toc-mobile-btn {
  display: none;
  position: fixed;
  bottom: 1.4rem;
  right: 1.2rem;
  align-items: center;
  gap: 0.4rem;
  background: var(--entry, #1e1e2e);
  border: 1px solid var(--border, #333);
  border-radius: 50px;
  padding: 0.45rem 0.9rem;
  font-size: 0.8rem;
  font-weight: 600;
  color: var(--secondary, #aaa);
  cursor: pointer;
  z-index: 200;
  box-shadow: 0 2px 12px rgba(0,0,0,0.4);
  transition: color 0.15s, border-color 0.15s;
  letter-spacing: 0.04em;
  text-transform: uppercase;
}
#toc-mobile-btn:hover { color: #22c55e; border-color: #22c55e; }
@media (max-width: 1279px) {
  #toc-mobile-btn { display: flex; }
}
</style>

<div id="reading-progress"></div>
{{ if .TableOfContents }}
<button id="toc-mobile-btn" onclick="
  var toc = document.querySelector('.toc');
  if (toc) {
    toc.scrollIntoView({behavior:'smooth', block:'start'});
    var det = toc.querySelector('details');
    if (det) det.open = true;
  }
">☰ Contents</button>
{{ end }}

<script>
// Reading progress
(function(){
  var bar = document.getElementById('reading-progress');
  function upd(){
    var h = document.documentElement;
    var pct = (window.scrollY / (h.scrollHeight - h.clientHeight)) * 100;
    bar.style.width = Math.min(100, pct) + '%';
  }
  window.addEventListener('scroll', upd, {passive: true});
  upd();
})();
</script>
{{ end }}

{{- /* ── 2. TOC scroll-spy + collapsible sub-sections ─────────────────── */ -}}
<script>
(function () {
  var toc = document.getElementById('TableOfContents');
  if (!toc) return;

  var mainDetails = document.querySelector('.toc > details');
  if (mainDetails && window.innerWidth >= 1280) mainDetails.open = true;

  /* Wrap nested <ul> in collapsible <details> */
  Array.from(toc.querySelectorAll('ul ul')).forEach(function (ul) {
    var parentLi = ul.parentElement;
    if (!parentLi || parentLi.tagName !== 'LI') return;
    var directLink = parentLi.querySelector(':scope > a');
    if (!directLink) return;
    var det = document.createElement('details');
    var sum = document.createElement('summary');
    sum.appendChild(directLink.cloneNode(true));
    det.appendChild(sum);
    det.appendChild(ul);
    directLink.replaceWith(det);
  });

  /* Scroll-spy (h2 and h3 only) */
  var headings = Array.from(document.querySelectorAll('h2[id], h3[id]'));
  if (!headings.length) return;
  var links = Array.from(toc.querySelectorAll('a[href^="#"]'));
  var cur = { link: null, heading: null };

  function activate(heading) {
    if (cur.link)    cur.link.classList.remove('toc-active');
    if (cur.heading) cur.heading.classList.remove('heading-active');
    cur.heading = heading || null;
    cur.link = null;
    if (!heading) return;
    heading.classList.add('heading-active');
    for (var i = 0; i < links.length; i++) {
      var frag = decodeURIComponent((links[i].getAttribute('href') || '').replace(/^#/, ''));
      if (frag === heading.id) { cur.link = links[i]; break; }
    }
    if (cur.link) {
      cur.link.classList.add('toc-active');
      var parentDet = cur.link.closest('#TableOfContents details');
      if (parentDet) parentDet.open = true;
      var panel = document.querySelector('.toc');
      if (panel && window.innerWidth >= 1280) {
        panel.scrollTop = Math.max(0, cur.link.offsetTop - panel.clientHeight / 2);
      }
    }
  }

  var lastHeading;
  function onScroll() {
    var threshold = window.scrollY + Math.min(140, window.innerHeight * 0.3);
    var found = null;
    for (var i = 0; i < headings.length; i++) {
      if (headings[i].getBoundingClientRect().top + window.scrollY <= threshold) {
        found = headings[i];
      }
    }
    if (found !== lastHeading) { lastHeading = found; activate(found); }
  }
  window.addEventListener('scroll', onScroll, { passive: true });
  onScroll();
})();
</script>
