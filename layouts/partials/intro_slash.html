{{- /* Green Katana Slash Intro — plays on EVERY page load */ -}}
<div id="intro-slash" aria-hidden="true">
  <div class="slash-half slash-top"></div>
  <div class="slash-half slash-bottom"></div>

  <!-- Katana SVG that sweeps across -->
  <div class="slash-katana-wrap" id="slash-katana">
    <svg class="slash-katana-svg" viewBox="0 0 520 40" fill="none" xmlns="http://www.w3.org/2000/svg">
      <!-- Blade -->
      <polygon points="0,16 480,18 500,20 480,22 0,24" fill="url(#bladeGrad)" />
      <!-- Tip -->
      <polygon points="480,18 520,20 480,22" fill="#ffffff" />
      <!-- Edge glow -->
      <polygon points="0,17 480,19 500,20 480,21 0,23" fill="rgba(255,255,255,0.18)" />
      <!-- Guard (tsuba) -->
      <ellipse cx="60" cy="20" rx="7" ry="14" fill="#22c55e" stroke="#16a34a" stroke-width="1.5"/>
      <!-- Handle (tsuka) -->
      <rect x="0" y="15" width="58" height="10" rx="4" fill="#15803d"/>
      <!-- Handle wrap diamonds -->
      <polygon points="8,15 14,20 8,25 2,20"  fill="#4ade80" opacity="0.7"/>
      <polygon points="22,15 28,20 22,25 16,20" fill="#4ade80" opacity="0.7"/>
      <polygon points="36,15 42,20 36,25 30,20" fill="#4ade80" opacity="0.7"/>
      <polygon points="50,15 56,20 50,25 44,20" fill="#4ade80" opacity="0.7"/>

      <defs>
        <linearGradient id="bladeGrad" x1="0" y1="0" x2="520" y2="0">
          <stop offset="0%"   stop-color="#4ade80"/>
          <stop offset="50%"  stop-color="#ffffff"/>
          <stop offset="100%" stop-color="transparent"/>
        </linearGradient>
      </defs>
    </svg>
    <!-- Motion blur glow trail -->
    <div class="slash-katana-trail"></div>
  </div>

  <!-- The slash cut line that lingers -->
  <div class="slash-line"></div>
</div>

<style>
#intro-slash {
  position: fixed;
  inset: 0;
  z-index: 99999;
  pointer-events: none;
  overflow: hidden;
}

/* ── Two screen halves ── */
.slash-half {
  position: absolute;
  left: 0; right: 0;
  background: #060a07;
  transition: transform 0.6s cubic-bezier(0.76, 0, 0.24, 1);
  will-change: transform;
}
.slash-top    { top: 0;    height: 50.2%; transform: translateY(0); }
.slash-bottom { bottom: 0; height: 50.2%; transform: translateY(0); }

/* ── Katana sweep ── */
.slash-katana-wrap {
  position: absolute;
  top: 50%;
  left: -540px;
  width: 520px;
  height: 40px;
  margin-top: -20px;
  transform: rotate(-3deg);
  transition: left 0.38s cubic-bezier(0.16, 1, 0.3, 1);
  will-change: left;
}
.slash-katana-svg {
  width: 100%;
  height: 100%;
  filter: drop-shadow(0 0 6px #22c55e) drop-shadow(0 0 18px rgba(34,197,94,0.6));
}
.slash-katana-trail {
  position: absolute;
  top: 50%; left: 0; right: 0;
  height: 1px;
  transform: translateY(-50%);
  background: linear-gradient(90deg, transparent, rgba(34,197,94,0.25), transparent);
  pointer-events: none;
}

/* ── The cut line ── */
.slash-line {
  position: absolute;
  left: 0; right: 0;
  top: 50%;
  height: 1px;
  transform: translateY(-50%) rotate(-3deg);
  background: linear-gradient(90deg,
    transparent 0%,
    rgba(34,197,94,0.6) 20%,
    rgba(255,255,255,0.9) 50%,
    rgba(34,197,94,0.6) 80%,
    transparent 100%);
  box-shadow: 0 0 10px 2px rgba(34,197,94,0.5);
  opacity: 0;
  transition: opacity 0.1s;
}

/* ── State classes ── */
#intro-slash.is-sweeping .slash-katana-wrap {
  left: calc(100% + 60px);
}
#intro-slash.is-cut .slash-line {
  opacity: 1;
}
#intro-slash.is-opening .slash-top    { transform: translateY(-100%); }
#intro-slash.is-opening .slash-bottom { transform: translateY(100%); }
#intro-slash.is-opening .slash-line   { opacity: 0; transition: opacity 0.4s; }
#intro-slash.is-done { display: none; }
</style>

<script>
(function () {
  var el = document.getElementById('intro-slash');
  if (!el) return;

  // Phase 1: katana sweeps across (380ms)
  setTimeout(function () { el.classList.add('is-sweeping'); }, 80);

  // Phase 2: slash cut appears
  setTimeout(function () { el.classList.add('is-cut'); }, 460);

  // Phase 3: halves split open
  setTimeout(function () { el.classList.add('is-opening'); }, 620);

  // Phase 4: remove from DOM
  setTimeout(function () { el.classList.add('is-done'); }, 1350);
})();
</script>
