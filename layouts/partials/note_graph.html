{{- /* Table of Contents Note Structure Graph — Positioned on the right under the Table of Contents */ -}}
<div class="toc-graph-widget" id="toc-graph-widget">
  <div class="toc-graph-header">
    <div class="toc-graph-title">
      <span class="toc-graph-dot"></span>
      <span>TOC Graph</span>
      <span class="toc-graph-count" id="toc-graph-count"></span>
    </div>
    <div class="toc-graph-actions">
      <a href="/graph/" class="toc-graph-full-link" title="Open Global Knowledge Graph">⤢ Full</a>
      <button id="toc-graph-toggle" class="toc-graph-toggle-btn" title="Toggle Graph">▾</button>
    </div>
  </div>

  <div class="toc-graph-body" id="toc-graph-body">
    <!-- Compact Square Canvas Viewport -->
    <div class="toc-graph-square-box" id="toc-graph-square-box">
      <canvas id="toc-graph-canvas"></canvas>
      <div id="toc-graph-tooltip" class="toc-graph-tooltip" style="display:none;"></div>
    </div>
    <div class="toc-graph-hint">
      <span>■ Click header square to jump to section</span>
    </div>
  </div>
</div>

<style>
/* ── TOC Graph Widget (Fits in Right Sidebar under TOC) ─────── */
.toc-graph-widget {
  background: var(--entry, #16161d);
  border: 1px solid var(--border, #2a2a38);
  border-radius: 12px;
  padding: 0.75rem 0.85rem;
  width: 100%;
  box-shadow: 0 4px 18px rgba(0, 0, 0, 0.25);
  box-sizing: border-box;
}

.toc-graph-header {
  display: flex;
  align-items: center;
  justify-content: space-between;
  margin-bottom: 0.5rem;
}

.toc-graph-title {
  display: flex;
  align-items: center;
  gap: 0.4rem;
  font-size: 0.72rem;
  font-weight: 700;
  letter-spacing: 0.08em;
  text-transform: uppercase;
  color: var(--primary, #e8e8f0);
}

.toc-graph-dot {
  width: 6px;
  height: 6px;
  background: #22c55e;
  border-radius: 50%;
  box-shadow: 0 0 5px rgba(34, 197, 94, 0.7);
}

.toc-graph-count {
  font-size: 0.65rem;
  color: #71717a;
  font-family: monospace;
}

.toc-graph-actions {
  display: flex;
  align-items: center;
  gap: 0.35rem;
}

.toc-graph-full-link {
  font-size: 0.65rem;
  font-weight: 600;
  color: #22c55e;
  text-decoration: none;
  background: rgba(34, 197, 94, 0.08);
  border: 1px solid rgba(34, 197, 94, 0.2);
  border-radius: 4px;
  padding: 0.15rem 0.35rem;
  transition: all 0.15s;
}
.toc-graph-full-link:hover {
  background: rgba(34, 197, 94, 0.2);
}

.toc-graph-toggle-btn {
  background: transparent;
  border: 1px solid var(--border, #2a2a38);
  border-radius: 4px;
  color: var(--secondary, #888);
  width: 20px;
  height: 20px;
  display: inline-flex;
  align-items: center;
  justify-content: center;
  cursor: pointer;
  font-size: 0.75rem;
  transition: all 0.15s;
}
.toc-graph-toggle-btn:hover {
  color: #22c55e;
  border-color: #22c55e;
}

/* Compact Square Canvas */
.toc-graph-square-box {
  position: relative;
  width: 100%;
  aspect-ratio: 1 / 1;
  max-width: 240px;
  max-height: 240px;
  margin: 0 auto;
  background: #121215;
  border: 1px solid rgba(255, 255, 255, 0.06);
  border-radius: 8px;
  overflow: hidden;
  box-shadow: inset 0 0 25px rgba(0, 0, 0, 0.5);
  cursor: grab;
}
.toc-graph-square-box:active {
  cursor: grabbing;
}

#toc-graph-canvas {
  width: 100%;
  height: 100%;
  display: block;
}

.toc-graph-hint {
  text-align: center;
  margin-top: 0.45rem;
  font-size: 0.63rem;
  color: #71717a;
}

/* Tooltip */
.toc-graph-tooltip {
  position: absolute;
  pointer-events: none;
  background: rgba(20, 20, 24, 0.96);
  backdrop-filter: blur(8px);
  border: 1px solid rgba(34, 197, 94, 0.45);
  border-radius: 6px;
  padding: 0.35rem 0.6rem;
  font-size: 0.68rem;
  color: #f4f4f5;
  font-weight: 600;
  max-width: 190px;
  box-shadow: 0 6px 20px rgba(0, 0, 0, 0.6);
  z-index: 50;
  transform: translate(-50%, -125%);
  line-height: 1.3;
}
</style>

<script>
(function () {
  var widget = document.getElementById('toc-graph-widget');
  if (!widget) return;

  var box = document.getElementById('toc-graph-square-box');
  var canvas = document.getElementById('toc-graph-canvas');
  var tooltip = document.getElementById('toc-graph-tooltip');
  var countEl = document.getElementById('toc-graph-count');
  var toggleBtn = document.getElementById('toc-graph-toggle');
  var bodyEl = document.getElementById('toc-graph-body');
  if (!box || !canvas) return;

  var ctx = canvas.getContext('2d');

  // Toggle Collapse
  var isCollapsed = false;
  toggleBtn.addEventListener('click', function () {
    isCollapsed = !isCollapsed;
    bodyEl.style.display = isCollapsed ? 'none' : 'block';
    toggleBtn.textContent = isCollapsed ? '▸' : '▾';
  });

  // 1. Extract Headings from Table of Contents / Content
  var headings = Array.from(document.querySelectorAll('.post-content h2, .post-content h3'));
  if (headings.length === 0) {
    widget.style.display = 'none';
    return;
  }

  if (countEl) {
    countEl.textContent = '(' + headings.length + ')';
  }

  // Note Title = Main Node
  var noteTitleEl = document.querySelector('.post-title');
  var noteTitle = noteTitleEl ? noteTitleEl.textContent.trim() : 'Note';

  // 2. Build Graph (Main Node in center, Headings radiating as square subnodes)
  var nodes = [];
  var links = [];

  var width = box.clientWidth || 230;
  var height = box.clientHeight || 230;
  var cx = width / 2;
  var cy = height / 2;

  // Center Main Node = Note Title
  var mainNode = {
    id: 'main-note',
    title: noteTitle,
    type: 'main',
    shape: 'circle',
    radius: 8.5,
    color: '#ffffff',
    homeX: cx,
    homeY: cy,
    x: cx,
    y: cy,
    vx: 0,
    vy: 0
  };
  nodes.push(mainNode);

  // Subnodes = Headers inside Table of Contents (Small Squares)
  var lastH2 = null;
  var angleStep = (Math.PI * 2) / headings.length;

  headings.forEach(function (h, idx) {
    var isH2 = h.tagName.toLowerCase() === 'h2';
    var cleanTitle = h.textContent.replace(/^#+\s*/, '').trim();
    var a = idx * angleStep;
    var dist = isH2 ? (62 + (idx % 2) * 16) : (78 + (idx % 2) * 12);

    var sqSize = isH2 ? 7.5 : 5.5; // Small shape square
    var subNode = {
      id: h.id || ('heading-' + idx),
      headerElement: h,
      title: cleanTitle,
      type: isH2 ? 'h2' : 'h3',
      shape: 'square',
      size: sqSize,
      color: isH2 ? '#a1a1aa' : '#71717a',
      homeX: cx + Math.cos(a) * dist,
      homeY: cy + Math.sin(a) * dist,
      x: cx + Math.cos(a) * dist,
      y: cy + Math.sin(a) * dist,
      vx: 0,
      vy: 0
    };
    nodes.push(subNode);

    // Link: Main Note Title ➔ H2 square
    if (isH2) {
      links.push({ source: mainNode, target: subNode, length: dist, strength: 0.14 });
      lastH2 = subNode;
    } else {
      // H3 square links to parent H2 if available, or Main Note Title
      var parent = lastH2 || mainNode;
      links.push({ source: parent, target: subNode, length: 35, strength: 0.16 });
    }
  });

  // 3. Canvas Setup
  function resize() {
    var dpr = window.devicePixelRatio || 1;
    width = box.clientWidth;
    height = box.clientHeight;
    canvas.width = width * dpr;
    canvas.height = height * dpr;
    ctx.scale(dpr, dpr);
  }
  window.addEventListener('resize', resize);
  resize();

  // 4. Stable Physics (Alpha decay + Home restoring springs)
  var simAlpha = 1.0;

  function tickPhysics() {
    if (simAlpha < 0.002) {
      for (var z = 0; z < nodes.length; z++) {
        nodes[z].vx = 0;
        nodes[z].vy = 0;
      }
      return;
    }

    var kHome = 0.07; // Home restoring spring

    for (var i = 0; i < nodes.length; i++) {
      var n = nodes[i];
      if (n === draggedNode) continue;
      n.vx += (n.homeX - n.x) * kHome * simAlpha;
      n.vy += (n.homeY - n.y) * kHome * simAlpha;
    }

    // Soft Collision
    for (var a = 0; a < nodes.length; a++) {
      var na = nodes[a];
      for (var b = a + 1; b < nodes.length; b++) {
        var nb = nodes[b];
        var dx = nb.x - na.x;
        var dy = nb.y - na.y;
        var dist = Math.sqrt(dx * dx + dy * dy) || 1;
        var minDist = (na.size || na.radius || 6) + (nb.size || nb.radius || 6) + 10;

        if (dist < minDist) {
          var push = (minDist - dist) * 0.45 * simAlpha;
          var nx = dx / dist;
          var ny = dy / dist;
          na.vx -= nx * push;
          na.vy -= ny * push;
          nb.vx += nx * push;
          nb.vy += ny * push;
        }
      }
    }

    // Link Tension
    for (var l = 0; l < links.length; l++) {
      var link = links[l];
      var ldx = link.target.x - link.source.x;
      var ldy = link.target.y - link.source.y;
      var ld = Math.sqrt(ldx * ldx + ldy * ldy) || 1;
      var diff = (ld - link.length) * link.strength * simAlpha;
      diff = Math.max(-4, Math.min(4, diff));

      link.source.vx += (ldx / ld) * diff;
      link.source.vy += (ldy / ld) * diff;
      link.target.vx -= (ldx / ld) * diff;
      link.target.vy -= (ldy / ld) * diff;
    }

    // Damping
    for (var k = 0; k < nodes.length; k++) {
      var nd = nodes[k];
      if (nd === draggedNode) continue;
      nd.vx *= 0.70;
      nd.vy *= 0.70;
      nd.x += nd.vx;
      nd.y += nd.vy;
    }

    if (!draggedNode) {
      simAlpha *= 0.96;
    }
  }

  // 5. Render Loop
  var hoveredNode = null;
  var draggedNode = null;
  var activeHeadingNode = null;

  function render() {
    tickPhysics();

    ctx.clearRect(0, 0, width, height);

    // Draw Links
    for (var i = 0; i < links.length; i++) {
      var l = links[i];
      var isHi = hoveredNode && (l.source === hoveredNode || l.target === hoveredNode);
      ctx.beginPath();
      ctx.moveTo(l.source.x, l.source.y);
      ctx.lineTo(l.target.x, l.target.y);

      if (isHi) {
        ctx.strokeStyle = '#22c55e';
        ctx.lineWidth = 1.3;
        ctx.globalAlpha = 0.95;
      } else {
        ctx.strokeStyle = '#3f3f46';
        ctx.lineWidth = 0.75;
        ctx.globalAlpha = hoveredNode ? 0.12 : 0.42;
      }
      ctx.stroke();
    }
    ctx.globalAlpha = 1;

    // Draw Nodes
    for (var j = 0; j < nodes.length; j++) {
      var node = nodes[j];
      var isHover = (node === hoveredNode);
      var isActive = (node === activeHeadingNode);

      // Main Node = Note Title (Circle)
      if (node.shape === 'circle') {
        ctx.beginPath();
        ctx.arc(node.x, node.y, node.radius, 0, Math.PI * 2);
        ctx.fillStyle = isHover ? '#22c55e' : '#f4f4f5';
        ctx.fill();
        ctx.strokeStyle = 'rgba(255, 255, 255, 0.4)';
        ctx.lineWidth = 1;
        ctx.stroke();

        // Label for Main Note Title
        ctx.font = 'bold 9px Inter, sans-serif';
        ctx.fillStyle = isHover ? '#22c55e' : '#e4e4e7';
        ctx.textAlign = 'center';
        ctx.textBaseline = 'top';

        // Shadow outline
        ctx.strokeStyle = '#121215';
        ctx.lineWidth = 2.5;
        var displayTitle = node.title.length > 18 ? node.title.slice(0, 16) + '..' : node.title;
        ctx.strokeText(displayTitle, node.x, node.y + node.radius + 3);
        ctx.fillText(displayTitle, node.x, node.y + node.radius + 3);
      }
      // Subnodes = Headers inside TOC (Small Square)
      else if (node.shape === 'square') {
        var half = node.size / 2;
        var sqColor = (isHover || isActive) ? '#22c55e' : node.color;

        // Glow if hovered or active
        if (isHover || isActive) {
          ctx.fillStyle = 'rgba(34, 197, 94, 0.35)';
          ctx.fillRect(node.x - half - 3, node.y - half - 3, node.size + 6, node.size + 6);
        }

        ctx.fillStyle = sqColor;
        ctx.fillRect(node.x - half, node.y - half, node.size, node.size);

        ctx.strokeStyle = (isHover || isActive) ? '#4ade80' : 'rgba(255, 255, 255, 0.18)';
        ctx.lineWidth = 1;
        ctx.strokeRect(node.x - half, node.y - half, node.size, node.size);
      }
    }

    requestAnimationFrame(render);
  }

  // 6. Mouse / Touch Interactions
  function findNode(ex, ey) {
    var rect = canvas.getBoundingClientRect();
    var x = ex - rect.left;
    var y = ey - rect.top;

    for (var i = nodes.length - 1; i >= 0; i--) {
      var n = nodes[i];
      var r = (n.shape === 'circle' ? n.radius : n.size) + 5;
      var dx = x - n.x;
      var dy = y - n.y;
      if (dx * dx + dy * dy <= r * r) {
        return n;
      }
    }
    return null;
  }

  canvas.addEventListener('mousemove', function (e) {
    var rect = canvas.getBoundingClientRect();
    var mx = e.clientX - rect.left;
    var my = e.clientY - rect.top;

    if (draggedNode) {
      draggedNode.x = mx;
      draggedNode.y = my;
      draggedNode.vx = 0;
      draggedNode.vy = 0;
      simAlpha = Math.max(simAlpha, 0.3);
      return;
    }

    var target = findNode(e.clientX, e.clientY);
    if (target !== hoveredNode) {
      hoveredNode = target;
      if (hoveredNode) {
        var prefix = hoveredNode.type === 'main' ? '★ Note Title' : (hoveredNode.type.toUpperCase() + ' Header');
        tooltip.innerHTML = '<strong>' + prefix + '</strong>: ' + hoveredNode.title;
        tooltip.style.display = 'block';
        tooltip.style.left = mx + 'px';
        tooltip.style.top = my + 'px';
      } else {
        tooltip.style.display = 'none';
      }
    } else if (hoveredNode) {
      tooltip.style.left = mx + 'px';
      tooltip.style.top = my + 'px';
    }
  });

  var clickStart = { x: 0, y: 0 };
  canvas.addEventListener('mousedown', function (e) {
    clickStart.x = e.clientX;
    clickStart.y = e.clientY;
    var target = findNode(e.clientX, e.clientY);
    if (target) {
      draggedNode = target;
      simAlpha = Math.max(simAlpha, 0.3);
    }
  });

  window.addEventListener('mouseup', function () {
    if (draggedNode) {
      simAlpha = 0.45; // Smoothly snap back to home position
    }
    draggedNode = null;
  });

  // Click on Header Square: Jump directly to that section in the note!
  canvas.addEventListener('click', function (e) {
    var dx = Math.abs(e.clientX - clickStart.x);
    var dy = Math.abs(e.clientY - clickStart.y);
    if (dx > 4 || dy > 4) return;

    var target = findNode(e.clientX, e.clientY);
    if (target && target.shape === 'square' && target.headerElement) {
      target.headerElement.scrollIntoView({ behavior: 'smooth', block: 'start' });
    }
  });

  // 7. Scroll-Spy: highlight current reading section on graph
  window.addEventListener('scroll', function () {
    var scrollPos = window.scrollY + 140;
    var current = null;
    for (var i = 0; i < headings.length; i++) {
      if (headings[i].offsetTop <= scrollPos) {
        current = headings[i];
      }
    }
    if (current) {
      for (var j = 0; j < nodes.length; j++) {
        if (nodes[j].headerElement === current) {
          activeHeadingNode = nodes[j];
          break;
        }
      }
    }
  }, { passive: true });

  render();
})();
</script>
