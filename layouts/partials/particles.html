{{- /* Green Leaf Particles — homepage only */ -}}
<canvas id="ka-particles" aria-hidden="true" style="position:fixed;top:0;left:0;width:100%;height:100%;pointer-events:none;z-index:0;"></canvas>

<script>
(function () {
  var canvas = document.getElementById('ka-particles');
  if (!canvas) return;
  var ctx = canvas.getContext('2d');

  var greens = ['#22c55e','#16a34a','#4ade80','#86efac','#15803d','#bbf7d0'];
  var leaves = [];
  var MAX = 18;

  function resize() {
    canvas.width  = window.innerWidth;
    canvas.height = window.innerHeight;
  }
  resize();
  window.addEventListener('resize', resize, { passive: true });

  function spawnLeaf() {
    return {
      x:      Math.random() * canvas.width,
      y:      -30,
      vy:     0.55 + Math.random() * 0.7,
      vx:     (Math.random() - 0.5) * 0.6,
      rot:    Math.random() * Math.PI * 2,
      rotV:   (Math.random() - 0.5) * 0.025,
      size:   7 + Math.random() * 9,
      color:  greens[Math.floor(Math.random() * greens.length)],
      alpha:  0.18 + Math.random() * 0.22,
      swing:  Math.random() * Math.PI * 2,
      swingV: 0.018 + Math.random() * 0.012
    };
  }

  function drawLeaf(ctx, size) {
    /* Simple elongated leaf shape using bezier curves */
    ctx.beginPath();
    ctx.moveTo(0, -size);
    ctx.bezierCurveTo( size * 0.6, -size * 0.5,  size * 0.8,  size * 0.3,  0,  size);
    ctx.bezierCurveTo(-size * 0.8,  size * 0.3, -size * 0.6, -size * 0.5,  0, -size);
    ctx.closePath();
    /* Midrib */
    ctx.moveTo(0, -size);
    ctx.lineTo(0,  size);
  }

  for (var i = 0; i < MAX; i++) {
    var l = spawnLeaf();
    l.y = Math.random() * canvas.height;
    leaves.push(l);
  }

  function draw() {
    ctx.clearRect(0, 0, canvas.width, canvas.height);
    for (var i = 0; i < leaves.length; i++) {
      var l = leaves[i];
      l.swing += l.swingV;
      l.x  += l.vx + Math.sin(l.swing) * 0.35;
      l.y  += l.vy;
      l.rot += l.rotV;

      ctx.save();
      ctx.translate(l.x, l.y);
      ctx.rotate(l.rot);
      ctx.globalAlpha = l.alpha;
      ctx.fillStyle   = l.color;
      ctx.strokeStyle = l.color;
      ctx.lineWidth   = 0.5;
      drawLeaf(ctx, l.size);
      ctx.fill();
      ctx.stroke();
      ctx.restore();

      if (l.y > canvas.height + 30) {
        leaves[i] = spawnLeaf();
      }
    }
    ctx.globalAlpha = 1;
    requestAnimationFrame(draw);
  }
  draw();
})();
</script>
