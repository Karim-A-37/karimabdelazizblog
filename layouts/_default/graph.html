{{- define "main" }}

<div class="graph-page-wrap">
  <!-- Minimalist Obsidian Header -->
  <header class="graph-header">
    <div class="graph-header__left">
      <div class="graph-badge">
        <span class="graph-badge__dot"></span>
        Obsidian Graph View
      </div>
      <h1 class="graph-title">Knowledge Graph</h1>
    </div>

    <!-- Floating Top Toolbar -->
    <div class="graph-toolbar">
      <div class="graph-search">
        <svg viewBox="0 0 24 24" width="14" height="14" fill="none" stroke="currentColor" stroke-width="2">
          <circle cx="11" cy="11" r="8"></circle>
          <line x1="21" y1="21" x2="16.65" y2="16.65"></line>
        </svg>
        <input type="text" id="graph-search" placeholder="Filter notes..." autocomplete="off" />
      </div>

      <div class="graph-actions">
        <button id="graph-btn-zoomin" title="Zoom in">+</button>
        <button id="graph-btn-zoomout" title="Zoom out">−</button>
        <button id="graph-btn-reset" title="Recenter">⟲</button>
      </div>

      <div class="graph-meta" id="graph-meta">Loading...</div>
    </div>
  </header>

  <!-- Obsidian Graph Canvas Viewport -->
  <div class="obsidian-graph-wrapper" id="obsidian-graph-wrapper">
    <canvas id="obsidian-canvas"></canvas>
    
    <!-- Hover Tooltip Card -->
    <div id="graph-tooltip" class="graph-tooltip" style="display:none;"></div>

    <!-- Bottom Legend / Hint -->
    <div class="graph-legend">
      <div class="legend-item"><span class="legend-dot legend-dot--hub"></span>Category Main Node</div>
      <div class="legend-item"><span class="legend-dot legend-dot--note"></span>Note Node</div>
      <div class="legend-item"><span class="legend-dot legend-dot--leaf"></span>Concept Leaf</div>
    </div>

    <div class="graph-hint">
      <span>Scroll to zoom · Drag nodes · Click note to open</span>
    </div>
  </div>
</div>

{{- /* Real Page Data from Hugo grouped by Series / Category */ -}}
<script id="graph-pages-data" type="application/json">
[
  {{- $first := true -}}
  {{- range site.RegularPages -}}
    {{- if and (ne .Layout "search") (ne .Layout "graph") (ne .Title "Search") (ne .Title "Knowledge Graph") -}}
      {{- if not $first }},{{- end -}}
      {{- $first = false -}}
      {{- $cat := "General" -}}
      {{- with .Params.series -}}
        {{- range $i, $s := . -}}
          {{- if eq $i 0 }}{{ $cat = $s }}{{ end -}}
        {{- end -}}
      {{- else -}}
        {{- if eq .Section "posts" }}{{ $cat = "Notes" }}{{ end -}}
        {{- if eq .Section "projects" }}{{ $cat = "Projects" }}{{ end -}}
        {{- if eq .Section "certs" }}{{ $cat = "Certifications" }}{{ end -}}
        {{- if eq .Section "" }}{{ $cat = "About" }}{{ end -}}
      {{- end -}}
      {
        "id": {{ .RelPermalink }},
        "title": {{ .Title }},
        "url": {{ .RelPermalink }},
        "category": {{ $cat }},
        "section": {{ .Section }},
        "series": {{ .Params.series | default slice }},
        "tags": {{ .Params.tags | default slice }},
        "weight": {{ .Params.weight | default 999 }},
        "summary": {{ .Summary | plainify | htmlUnescape | truncate 110 }}
      }
    {{- end -}}
  {{- end -}}
]
</script>

<style>
/* ── Obsidian Formalized Graph Theme ──────────────────────────── */
.graph-page-wrap {
  width: 100%;
  max-width: 1200px;
  margin: 0 auto;
  padding: 0 1rem 2.5rem;
}

.graph-header {
  display: flex;
  align-items: center;
  justify-content: space-between;
  flex-wrap: wrap;
  gap: 1rem;
  margin-bottom: 0.9rem;
}

.graph-badge {
  display: inline-flex;
  align-items: center;
  gap: 0.4rem;
  font-size: 0.68rem;
  font-weight: 700;
  letter-spacing: 0.08em;
  text-transform: uppercase;
  color: #a1a1aa;
  margin-bottom: 0.2rem;
}
.graph-badge__dot {

  background: #22c55e;
  border-radius: 50%;
}

.graph-title {
  font-size: clamp(1.6rem, 3.5vw, 2.2rem);
  font-weight: 900;
  letter-spacing: -0.03em;

  color: #f4f4f5;
}

/* Toolbar */
.graph-toolbar {
  display: flex;
  align-items: center;
  gap: 0.6rem;
  background: #18181b;
  border: 1px solid rgba(255, 255, 255, 0.08);
  border-radius: 8px;
  padding: 0.35rem 0.65rem;
}

.graph-search {
  display: flex;
  align-items: center;
  gap: 0.4rem;
  background: #111113;
  border: 1px solid rgba(255, 255, 255, 0.06);
  border-radius: 6px;

}

}
#graph-search {
  background: transparent;
  border: none;
  outline: none;
  font-size: 0.78rem;
  color: #e4e4e7;
  width: 140px;
}
#graph-search::placeholder {
  color: #71717a;
}

.graph-actions {
  display: flex;
  gap: 0.25rem;
}
.graph-actions button {
  width: 26px;
  height: 26px;
  display: inline-flex;
  align-items: center;

  background: #111113;
  border: 1px solid rgba(255, 255, 255, 0.08);

}

/* ── Canvas Viewport (Authentic Obsidian Dark Canvas) ──────────── */
.obsidian-graph-wrapper {
  position: relative;
  width: 100%;
  height: 680px;
  background: #141416;
  border: 1px solid rgba(255, 255, 255, 0.08);
  border-radius: 12px;
  overflow: hidden;
  box-shadow: inset 0 0 60px rgba(0, 0, 0, 0.5), 0 10px 30px rgba(0, 0, 0, 0.5);
  cursor: grab;
}
.obsidian-graph-wrapper:active {
  cursor: grabbing;
}
#obsidian-canvas {
  width: 100%;
  height: 100%;
  display: block;
}

/* Tooltip */
.graph-tooltip {
  position: absolute;
  pointer-events: none;
  background: rgba(24, 24, 27, 0.95);
  backdrop-filter: blur(12px);
  border: 1px solid rgba(255, 255, 255, 0.14);
  border-radius: 8px;
  padding: 0.7rem 0.9rem;

.graph-tooltip__hint {

/* Legend & Hint */
.graph-legend {
  position: absolute;
  bottom: 0.8rem;
  left: 1rem;
  display: flex;

  background: rgba(18, 18, 20, 0.85);
  backdrop-filter: blur(8px);
  border: 1px solid rgba(255, 255, 255, 0.06);

}

}

}

  position: absolute;
  bottom: 0.8rem;
  right: 1rem;
  font-size: 0.68rem;
  color: #52525b;
  pointer-events: none;
}
</style>

<script>
(function () {
  var pagesEl = document.getElementById('graph-pages-data');
  if (!pagesEl) return;
  var rawPages = JSON.parse(pagesEl.textContent || '[]');

  var container = document.getElementById('obsidian-graph-wrapper');
  var canvas = document.getElementById('obsidian-canvas');
  var ctx = canvas.getContext('2d');
  var tooltip = document.getElementById('graph-tooltip');
  var searchInput = document.getElementById('graph-search');
  var metaEl = document.getElementById('graph-meta');

  // Obsidian Palette (Monochromatic with soft silver & cyber accents)
  var COLOR_MAIN_HUB = '#f4f4f5';      // Bright white/silver for Main Categories
  var COLOR_NOTE     = '#a1a1aa';      // Slate silver for Notes
  var COLOR_LEAF     = '#52525b';      // Subtle dark-gray for concept leaves
  var COLOR_HOVER    = '#22c55e';      // Green highlight on hover

  var nodes = [];
  var links = [];
  var nodeMap = {};

  function addNode(node) {
    if (!nodeMap[node.id]) {
      nodes.push(node);
      nodeMap[node.id] = node;
    }
    return nodeMap[node.id];
  }

  function addLink(sourceId, targetId, length, strength) {
    var s = nodeMap[sourceId];
    var t = nodeMap[targetId];
    if (s && t) {
      links.push({
        source: s,
        target: t,
        length: length || 50,
        strength: strength || 0.1
      });
    }
  }

  // ── 1. Identify Categories and Group Notes Under Them ────────────
  // eJPT, wazuh, certs, etc.
  var categories = {};

  rawPages.forEach(function (p) {
    var cat = p.category || 'General';
    // Format friendly category display names
    if (cat.toLowerCase() === 'ejpt') cat = 'eJPT';
    if (cat.toLowerCase() === 'wazuh') cat = 'Wazuh SIEM';
    if (cat.toLowerCase() === 'certs') cat = 'Certifications';
    if (cat.toLowerCase() === 'about') cat = 'Profile';

    if (!categories[cat]) {
      categories[cat] = [];
    }
    categories[cat].push(p);
  });

  // Specific Concept Leaves to attach to notes to create dense dandelions like in Obsidian
  var noteConceptsMap = {
    'Introduction to information gathering': ['WHOIS Protocol', 'DNS Records', 'Passive Footprinting', 'Domain Registrars'],
    'Active Reconnaissance': ['Web Spidering', 'DNS Enumeration', 'Banner Grabbing', 'Robots.txt Analysis'],
    'Passive Reconnaissance': ['Google Dorking', 'TheHarvester', 'Netcraft', 'Social Engineering Vectors'],
    'Network Primer': ['TCP 3-Way Handshake', 'UDP Headers', 'OSI 7 Layers', 'CIDR Subnetting', 'Routing Gateway'],
    'Host Discovery': ['ARP Sweeps', 'ICMP Echo', 'TCP SYN Ping', 'UDP Discovery', 'Netdiscover'],
    'Port Scanning': ['SYN Stealth (-sS)', 'Connect Scan (-sT)', 'UDP Scan (-sU)', 'Service Version (-sV)', 'OS Detection (-O)', 'NSE Scripts'],
    'Scanning Optmization': ['Timing Templates (T0-T5)', 'Packet Fragment (-f)', 'Decoy Scan (-D)', 'MTU Spoofing', 'ACK Probe (-sA)'],
    'Enumeration': ['FTP Port 21', 'SMB/Samba (139/445)', 'Apache HTTP (80/443)', 'MySQL DB (3306)', 'SSH (22)', 'SMTP Mail (25)', 'Smbclient', 'Rpcclient Anonymous'],
    'Lab 1 - Wazuh + Suricata IDS Setup': ['Suricata NIDS Engine', 'Fast.log Alerts', 'Eve.json Stream', 'Promiscuous Mode', 'Ruleset Tuning'],
    'Lab 2 - Malware Detection with Wazuh': ['File Integrity Monitoring (FIM)', 'Sysmon Process Logs', 'VirusTotal API Integration', 'XML Alert Decoders'],
    'Lab 3 - SetChain: AI + Blockchain Threat Detection': ['AI Anomaly Classifier', 'Hyperledger Fabric', 'IPFS Distributed Log', 'n8n Automation Engine', 'Tamper-Proof Audit'],
    'Certifications': ['Cisco CCNA Security', 'eJPT Junior Pentester', 'MITRE ATT&CK Matrix', 'SANS IR Lifecycle']
  };

  // ── 2. Build Category Main Nodes & Connected Small Note Nodes ───
  var categoryKeys = Object.keys(categories);

  categoryKeys.forEach(function (catName) {
    var catId = 'cat-' + catName.toLowerCase().replace(/[^a-z0-9]/g, '-');

    // Create the MAIN NODE for the category (Large bright hub)
    addNode({
      id: catId,
      title: catName,
      url: null,
      type: 'category',
      radius: 12.5,
      color: COLOR_MAIN_HUB,
      x: 0, y: 0, vx: 0, vy: 0,
      summary: 'Main Category: ' + catName + ' (' + categories[catName].length + ' published notes)'
    });

    // Sort notes inside category by weight
    var catNotes = categories[catName];
    catNotes.sort(function (a, b) { return (a.weight || 999) - (b.weight || 999); });

    // Add Small Note Nodes radiating from this Main Category Node
    catNotes.forEach(function (p, pIdx) {
      var noteNode = addNode({
        id: p.id,
        title: p.title,
        url: p.url,
        type: 'note',
        category: catName,
        radius: 5.8,
        color: COLOR_NOTE,
        x: 0, y: 0, vx: 0, vy: 0,
        summary: p.summary || ''
      });

      // Spoke link: Main Category Node ➔ Note Node
      addLink(catId, p.id, 55, 0.15);

      // Sibling link between consecutive notes in the series (e.g. Day-0 -> Day-1...)
      if (pIdx > 0) {
        addLink(catNotes[pIdx - 1].id, p.id, 45, 0.08);
      }

      // Add concept leaf nodes radiating off this note for authentic dandelion starbursts!
      var concepts = noteConceptsMap[p.title] || [];
      concepts.forEach(function (cName, cIdx) {
        var leafId = p.id + '-c-' + cIdx;
        addNode({
          id: leafId,
          title: cName,
          url: p.url, // clicking concept opens parent note!
          type: 'concept',
          category: catName,
          radius: 3.2,
          color: COLOR_LEAF,
          x: 0, y: 0, vx: 0, vy: 0,
          summary: 'Core concept in ' + p.title
        });
        // Short spoke link: Note ➔ Concept Leaf
        addLink(p.id, leafId, 28 + (cIdx % 3) * 10, 0.18);
      });
    });
  });

  // ── 3. Cross-Link the Main Category Nodes in the Center ─────────
  if (categoryKeys.length > 1) {
    for (var i = 0; i < categoryKeys.length; i++) {
      var catAId = 'cat-' + categoryKeys[i].toLowerCase().replace(/[^a-z0-9]/g, '-');
      for (var j = i + 1; j < categoryKeys.length; j++) {
        var catBId = 'cat-' + categoryKeys[j].toLowerCase().replace(/[^a-z0-9]/g, '-');
        addLink(catAId, catBId, 220, 0.015);
      }
    }
  }

  if (metaEl) {
    metaEl.textContent = categoryKeys.length + ' categories · ' + nodes.length + ' nodes';
  }

  // ── 4. Position Layout (Place Category Hubs evenly) ─────────────
  var width = container.clientWidth || 900;
  var height = container.clientHeight || 680;

  var mainHubs = nodes.filter(function (n) { return n.type === 'category'; });
  var hubAngleStep = (Math.PI * 2) / Math.max(1, mainHubs.length);

  mainHubs.forEach(function (h, idx) {
    var a = idx * hubAngleStep;
    var dist = Math.min(width, height) * 0.32;
    h.x = (width / 2) + Math.cos(a) * dist;
    h.y = (height / 2) + Math.sin(a) * dist;
  });

  // Position notes and leaves close to their parent
  nodes.forEach(function (n) {
    if (n.type !== 'category') {
      var parent = null;
      for (var k = 0; k < links.length; k++) {
        if (links[k].target === n) { parent = links[k].source; break; }
        if (links[k].source === n) { parent = links[k].target; break; }
      }
      if (parent) {
        var a = Math.random() * Math.PI * 2;
        var d = 30 + Math.random() * 40;
        n.x = parent.x + Math.cos(a) * d;
        n.y = parent.y + Math.sin(a) * d;
      } else {
        n.x = (width / 2) + (Math.random() * 100 - 50);
        n.y = (height / 2) + (Math.random() * 100 - 50);
      }
    }
  });

  // Viewport Transform (Zoom / Pan)
  var view = {
    x: 0,
    y: 0,
    scale: 0.95
  };

  function resize() {
    var dpr = window.devicePixelRatio || 1;
    width = container.clientWidth;
    height = container.clientHeight;
    canvas.width = width * dpr;
    canvas.height = height * dpr;
    ctx.scale(dpr, dpr);
  }
  window.addEventListener('resize', resize);
  resize();

  view.x = (width * (1 - view.scale)) / 2;
  view.y = (height * (1 - view.scale)) / 2;

  // ── 5. Physics Simulation ───────────────────────────────────────
  function tickPhysics() {
    var kRepel = 750;
    var kCenter = 0.007;
    var cx = width / 2;
    var cy = height / 2;

    // Repulsion between nodes
    for (var i = 0; i < nodes.length; i++) {
      var n1 = nodes[i];
      for (var j = i + 1; j < nodes.length; j++) {
        var n2 = nodes[j];
        var dx = n2.x - n1.x;
        var dy = n2.y - n1.y;
        var d2 = dx * dx + dy * dy || 1;
        var dist = Math.sqrt(d2);

        var isBothHubs = (n1.type === 'category' && n2.type === 'category');
        var maxRange = isBothHubs ? 400 : 160;

        if (dist < maxRange) {
          var repMult = isBothHubs ? 4.5 : 1;
          var force = (kRepel * repMult) / d2;
          var fx = (dx / dist) * force;
          var fy = (dy / dist) * force;
          n1.vx -= fx;
          n1.vy -= fy;
          n2.vx += fx;
          n2.vy += fy;
        }
      }

      // Centering force
      n1.vx += (cx - n1.x) * kCenter;
      n1.vy += (cy - n1.y) * kCenter;
    }

    // Link spring tension
    for (var l = 0; l < links.length; l++) {
      var link = links[l];
      var dx = link.target.x - link.source.x;
      var dy = link.target.y - link.source.y;
      var d = Math.sqrt(dx * dx + dy * dy) || 1;
      var diff = (d - link.length) * link.strength;

      var fx = (dx / d) * diff;
      var fy = (dy / d) * diff;

      link.source.vx += fx;
      link.source.vy += fy;
      link.target.vx -= fx;
      link.target.vy -= fy;
    }

    // Damping and update
    for (var n = 0; n < nodes.length; n++) {
      var node = nodes[n];
      if (node === draggedNode) continue;
      node.vx *= 0.82;
      node.vy *= 0.82;
      node.x += node.vx;
      node.y += node.vy;
    }
  }

  // ── 6. Rendering Loop ───────────────────────────────────────────
  var hoveredNode = null;
  var draggedNode = null;
  var searchQuery = '';

  function isConnected(a, b) {
    if (!a || !b) return false;
    for (var i = 0; i < links.length; i++) {
      var l = links[i];
      if ((l.source === a && l.target === b) || (l.source === b && l.target === a)) {
        return true;
      }
    }
    return false;
  }

  function render() {
    tickPhysics();

    ctx.save();
    ctx.clearRect(0, 0, width, height);

    ctx.translate(view.x, view.y);
    ctx.scale(view.scale, view.scale);

    // 1. Draw Links (Delicate hairline links like in Obsidian)
    for (var i = 0; i < links.length; i++) {
      var l = links[i];
      var isHighlighted = hoveredNode && (l.source === hoveredNode || l.target === hoveredNode);

      ctx.beginPath();
      ctx.moveTo(l.source.x, l.source.y);
      ctx.lineTo(l.target.x, l.target.y);

      if (isHighlighted) {
        ctx.strokeStyle = '#22c55e';
        ctx.lineWidth = 1.6;
        ctx.globalAlpha = 0.95;
      } else {
        ctx.strokeStyle = '#3f3f46';
        ctx.lineWidth = 0.75;
        ctx.globalAlpha = hoveredNode ? 0.08 : 0.38;
      }
      ctx.stroke();
    }
    ctx.globalAlpha = 1;

    // 2. Draw Nodes
    for (var j = 0; j < nodes.length; j++) {
      var node = nodes[j];
      var isHovered = (node === hoveredNode);
      var isLinked = hoveredNode && isConnected(hoveredNode, node);
      var isMatch = !searchQuery || (node.title && node.title.toLowerCase().indexOf(searchQuery) !== -1);

      var alpha = 1;
      if (hoveredNode) {
        alpha = (isHovered || isLinked) ? 1 : 0.12;
      } else if (!isMatch) {
        alpha = 0.12;
      }
      ctx.globalAlpha = alpha;

      // Glow halo on hover or search match
      if (isHovered || (searchQuery && isMatch)) {
        ctx.beginPath();
        ctx.arc(node.x, node.y, node.radius + 5, 0, Math.PI * 2);
        ctx.fillStyle = 'rgba(34, 197, 94, 0.35)';
        ctx.fill();
      }

      // Solid Node Body
      ctx.beginPath();
      ctx.arc(node.x, node.y, node.radius, 0, Math.PI * 2);
      ctx.fillStyle = isHovered ? COLOR_HOVER : node.color;
      ctx.fill();

      // Main Category Node Outline
      if (node.type === 'category') {
        ctx.strokeStyle = 'rgba(255, 255, 255, 0.35)';
        ctx.lineWidth = 1.2;
        ctx.stroke();
      }

      // Labels:
      // - Main Category Nodes: ALWAYS show label!
      // - Notes & Leaves: show on hover or when directly connected
      var showLabel = isHovered || isLinked || (node.type === 'category') || (searchQuery && isMatch);
      if (showLabel) {
        var isCat = (node.type === 'category');
        ctx.font = (isCat ? 'bold 12px' : '500 10px') + ' Inter, sans-serif';
        ctx.fillStyle = isHovered ? '#22c55e' : (isCat ? '#ffffff' : '#d4d4d8');
        ctx.textAlign = 'center';
        ctx.textBaseline = 'top';

        // Dark background shadow for maximum clarity
        ctx.strokeStyle = '#141416';
        ctx.lineWidth = 3;
        ctx.strokeText(node.title, node.x, node.y + node.radius + 4);
        ctx.fillText(node.title, node.x, node.y + node.radius + 4);
      }
    }

    ctx.restore();
    requestAnimationFrame(render);
  }

  // ── 7. Interaction (Drag, Hover, Click, Zoom) ───────────────────
  var isPanning = false;
  var panStart = { x: 0, y: 0 };
  var clickStart = { x: 0, y: 0 };

  function screenToWorld(sx, sy) {
    var rect = canvas.getBoundingClientRect();
    return {
      x: (sx - rect.left - view.x) / view.scale,
      y: (sy - rect.top - view.y) / view.scale
    };
  }

  function findNodeAt(sx, sy) {
    var pt = screenToWorld(sx, sy);
    for (var i = nodes.length - 1; i >= 0; i--) {
      var n = nodes[i];
      var dx = pt.x - n.x;
      var dy = pt.y - n.y;
      var hitRadius = n.radius + 6;
      if (dx * dx + dy * dy <= hitRadius * hitRadius) {
        return n;
      }
    }
    return null;
  }

  canvas.addEventListener('mousemove', function (e) {
    if (draggedNode) {
      var pt = screenToWorld(e.clientX, e.clientY);
      draggedNode.x = pt.x;
      draggedNode.y = pt.y;
      draggedNode.vx = 0;
      draggedNode.vy = 0;
      return;
    }

    if (isPanning) {
      view.x = e.clientX - panStart.x;
      view.y = e.clientY - panStart.y;
      return;
    }

    var target = findNodeAt(e.clientX, e.clientY);
    if (target !== hoveredNode) {
      hoveredNode = target;
      if (hoveredNode) {
        showTooltip(hoveredNode, e.clientX, e.clientY);
      } else {
        tooltip.style.display = 'none';
      }
    } else if (hoveredNode) {
      updateTooltip(e.clientX, e.clientY);
    }
  });

  canvas.addEventListener('mousedown', function (e) {
    clickStart.x = e.clientX;
    clickStart.y = e.clientY;

    var target = findNodeAt(e.clientX, e.clientY);
    if (target) {
      draggedNode = target;
    } else {
      isPanning = true;
      panStart.x = e.clientX - view.x;
      panStart.y = e.clientY - view.y;
    }
  });

  window.addEventListener('mouseup', function () {
    draggedNode = null;
    isPanning = false;
  });

  canvas.addEventListener('click', function (e) {
    var dx = Math.abs(e.clientX - clickStart.x);
    var dy = Math.abs(e.clientY - clickStart.y);
    if (dx > 4 || dy > 4) return;

    var target = findNodeAt(e.clientX, e.clientY);
    if (target && target.url) {
      window.location.href = target.url;
    }
  });

  // Zoom
  canvas.addEventListener('wheel', function (e) {
    e.preventDefault();
    var zoomFactor = e.deltaY < 0 ? 1.12 : 0.89;
    var newScale = Math.max(0.3, Math.min(3.5, view.scale * zoomFactor));

    var rect = canvas.getBoundingClientRect();
    var mouseX = e.clientX - rect.left;
    var mouseY = e.clientY - rect.top;

    view.x = mouseX - (mouseX - view.x) * (newScale / view.scale);
    view.y = mouseY - (mouseY - view.y) * (newScale / view.scale);
    view.scale = newScale;
  }, { passive: false });

  // Tooltip
  function showTooltip(n, sx, sy) {
    var typeLabel = n.type === 'category' ? 'Main Category' : (n.type === 'note' ? 'Note' : 'Concept');
    tooltip.innerHTML =
      '<span class="graph-tooltip__tag">' + typeLabel + '</span>' +
      '<div class="graph-tooltip__title">' + n.title + '</div>' +
      (n.summary ? '<div class="graph-tooltip__summary">' + n.summary + '</div>' : '') +
      (n.url ? '<div class="graph-tooltip__hint">Click to open note ➔</div>' : '');

    tooltip.style.display = 'block';
    updateTooltip(sx, sy);
  }

  function updateTooltip(sx, sy) {
    var rect = container.getBoundingClientRect();
    tooltip.style.left = (sx - rect.left) + 'px';
    tooltip.style.top = (sy - rect.top) + 'px';
  }

  // Search input
  searchInput.addEventListener('input', function (e) {
    searchQuery = (e.target.value || '').trim().toLowerCase();
  });

  // Buttons
  document.getElementById('graph-btn-zoomin').addEventListener('click', function () {
    view.scale = Math.min(3.5, view.scale * 1.25);
  });
  document.getElementById('graph-btn-zoomout').addEventListener('click', function () {
    view.scale = Math.max(0.3, view.scale * 0.8);
  });
  document.getElementById('graph-btn-reset').addEventListener('click', function () {
    view.scale = 0.95;
    view.x = (width * (1 - view.scale)) / 2;
    view.y = (height * (1 - view.scale)) / 2;
  });

  render();
})();
</script>
