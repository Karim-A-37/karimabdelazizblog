{{- define "main" }}

<div class="graph-page-wrap">
  <!-- Minimalist Obsidian Header -->
  <header class="graph-header">
    <div class="graph-header__left">
      <div class="graph-badge">
        <span class="graph-badge__dot"></span>
        Obsidian Graph View
      </div>
      <h1 class="graph-title">Knowledge Graph</h1>
    </div>

    <!-- Floating Top Toolbar -->
    <div class="graph-toolbar">
      <div class="graph-search">
        <svg viewBox="0 0 24 24" width="14" height="14" fill="none" stroke="currentColor" stroke-width="2">
          <circle cx="11" cy="11" r="8"></circle>
          <line x1="21" y1="21" x2="16.65" y2="16.65"></line>
        </svg>
        <input type="text" id="graph-search" placeholder="Search graph..." autocomplete="off" />
      </div>

      <div class="graph-actions">
        <button id="graph-btn-zoomin" title="Zoom in">+</button>
        <button id="graph-btn-zoomout" title="Zoom out">−</button>
        <button id="graph-btn-reset" title="Recenter">⟲</button>
      </div>

      <div class="graph-meta" id="graph-meta">Loading...</div>
    </div>
  </header>

  <!-- Obsidian Graph Canvas Viewport -->
  <div class="obsidian-graph-wrapper" id="obsidian-graph-wrapper">
    <canvas id="obsidian-canvas"></canvas>
    
    <!-- Hover Tooltip Card -->
    <div id="graph-tooltip" class="graph-tooltip" style="display:none;"></div>

    <!-- Minimal Corner Hint -->
    <div class="graph-hint">
      <span>Scroll to zoom · Drag to pan · Click node to open</span>
    </div>
  </div>
</div>

{{- /* Real Page Data from Hugo */ -}}
<script id="graph-pages-data" type="application/json">
[
  {{- $first := true -}}
  {{- range site.RegularPages -}}
    {{- if and (ne .Layout "search") (ne .Layout "graph") (ne .Title "Search") (ne .Title "Knowledge Graph") -}}
      {{- if not $first }},{{- end -}}
      {{- $first = false -}}
      {
        "id": {{ .RelPermalink }},
        "title": {{ .Title }},
        "url": {{ .RelPermalink }},
        "section": {{ .Section }},
        "series": {{ .Params.series | default slice }},
        "tags": {{ .Params.tags | default slice }},
        "summary": {{ .Summary | plainify | htmlUnescape | truncate 110 }}
      }
    {{- end -}}
  {{- end -}}
]
</script>

<style>
/* ── Obsidian Formalized Graph Theme ──────────────────────────── */
.graph-page-wrap {
  width: 100%;
  max-width: 1200px;
  margin: 0 auto;
  padding: 0 1rem 2.5rem;
}

.graph-header {
  display: flex;
  align-items: center;
  justify-content: space-between;
  flex-wrap: wrap;
  gap: 1rem;
  margin-bottom: 0.9rem;
}

.graph-badge {
  display: inline-flex;
  align-items: center;
  gap: 0.4rem;
  font-size: 0.68rem;
  font-weight: 700;
  letter-spacing: 0.08em;
  text-transform: uppercase;
  color: #a1a1aa;
  margin-bottom: 0.2rem;
}
.graph-badge__dot {
  width: 6px;
  height: 6px;
  background: #22c55e;
  border-radius: 50%;
}

.graph-title {
  font-size: clamp(1.6rem, 3.5vw, 2.2rem);
  font-weight: 900;
  letter-spacing: -0.03em;
  margin: 0;
  color: #f4f4f5;
}

/* Toolbar */
.graph-toolbar {
  display: flex;
  align-items: center;
  gap: 0.6rem;
  background: #18181b;
  border: 1px solid rgba(255, 255, 255, 0.08);
  border-radius: 8px;
  padding: 0.35rem 0.65rem;
}

.graph-search {
  display: flex;
  align-items: center;
  gap: 0.4rem;
  background: #111113;
  border: 1px solid rgba(255, 255, 255, 0.06);
  border-radius: 6px;
  padding: 0.25rem 0.6rem;
}
.graph-search svg {
  color: #71717a;
}
#graph-search {
  background: transparent;
  border: none;
  outline: none;
  font-size: 0.78rem;
  color: #e4e4e7;
  width: 140px;
}
#graph-search::placeholder {
  color: #71717a;
}

.graph-actions {
  display: flex;
  gap: 0.25rem;
}
.graph-actions button {
  width: 26px;
  height: 26px;
  display: inline-flex;
  align-items: center;
  justify-content: center;
  background: #111113;
  border: 1px solid rgba(255, 255, 255, 0.08);
  border-radius: 5px;
  color: #a1a1aa;
  font-size: 0.85rem;
  cursor: pointer;
  transition: all 0.15s ease;
}
.graph-actions button:hover {
  background: #27272a;
  color: #f4f4f5;
  border-color: rgba(255, 255, 255, 0.2);
}

.graph-meta {
  font-size: 0.72rem;
  color: #71717a;
  font-family: monospace;
  padding-left: 0.3rem;
  border-left: 1px solid rgba(255, 255, 255, 0.08);
}

/* ── Canvas Viewport (Authentic Obsidian Dark Canvas) ──────────── */
.obsidian-graph-wrapper {
  position: relative;
  width: 100%;
  height: 680px;
  background: #141416;
  border: 1px solid rgba(255, 255, 255, 0.08);
  border-radius: 12px;
  overflow: hidden;
  box-shadow: inset 0 0 60px rgba(0, 0, 0, 0.5), 0 10px 30px rgba(0, 0, 0, 0.5);
  cursor: grab;
}
.obsidian-graph-wrapper:active {
  cursor: grabbing;
}
#obsidian-canvas {
  width: 100%;
  height: 100%;
  display: block;
}

/* Tooltip */
.graph-tooltip {
  position: absolute;
  pointer-events: none;
  background: rgba(24, 24, 27, 0.95);
  backdrop-filter: blur(12px);
  border: 1px solid rgba(255, 255, 255, 0.14);
  border-radius: 8px;
  padding: 0.7rem 0.9rem;
  max-width: 260px;
  box-shadow: 0 10px 30px rgba(0,0,0,0.6);
  z-index: 100;
  transform: translate(-50%, -125%);
  transition: opacity 0.1s ease;
}
.graph-tooltip__tag {
  display: inline-block;
  font-size: 0.6rem;
  font-weight: 700;
  letter-spacing: 0.08em;
  text-transform: uppercase;
  color: #22c55e;
  margin-bottom: 0.25rem;
}
.graph-tooltip__title {
  font-size: 0.84rem;
  font-weight: 700;
  color: #fafafa;
  line-height: 1.3;
  margin-bottom: 0.25rem;
}
.graph-tooltip__summary {
  font-size: 0.72rem;
  color: #a1a1aa;
  line-height: 1.4;
  margin-bottom: 0.35rem;
}
.graph-tooltip__hint {
  font-size: 0.65rem;
  color: #22c55e;
  font-weight: 600;
}

/* Bottom Hint */
.graph-hint {
  position: absolute;
  bottom: 0.8rem;
  right: 1rem;
  font-size: 0.68rem;
  color: #52525b;
  pointer-events: none;
  letter-spacing: 0.02em;
}
</style>

<script>
(function () {
  var pagesEl = document.getElementById('graph-pages-data');
  if (!pagesEl) return;
  var pages = JSON.parse(pagesEl.textContent || '[]');

  var container = document.getElementById('obsidian-graph-wrapper');
  var canvas = document.getElementById('obsidian-canvas');
  var ctx = canvas.getContext('2d');
  var tooltip = document.getElementById('graph-tooltip');
  var searchInput = document.getElementById('graph-search');
  var metaEl = document.getElementById('graph-meta');

  // Obsidian Theme Palette (Formalized Monochromatic + Subtle Accents)
  var COLOR_HUB = '#e4e4e7';          // Solid bright silver for cluster hubs
  var COLOR_NOTE = '#a1a1aa';         // Medium silver/slate for notes
  var COLOR_CONCEPT = '#71717a';      // Muted slate for sub-concept spoke leaves
  var COLOR_HIGHLIGHT = '#22c55e';    // Cyber green glow on hover/active

  var nodes = [];
  var links = [];
  var nodeMap = {};

  function registerNode(node) {
    if (!nodeMap[node.id]) {
      nodes.push(node);
      nodeMap[node.id] = node;
    }
    return nodeMap[node.id];
  }

  function registerLink(sourceId, targetId, length, strength) {
    var s = nodeMap[sourceId];
    var t = nodeMap[targetId];
    if (s && t) {
      links.push({
        source: s,
        target: t,
        length: length || 50,
        strength: strength || 0.08
      });
    }
  }

  // ── 1. Create Core Cluster Starbursts (Obsidian Dandelions) ───
  var clusterDefinitions = [
    {
      id: 'cluster-recon',
      title: 'Reconnaissance',
      type: 'hub',
      tags: ['recon', 'osint'],
      spokes: ['WHOIS & DNS', 'Subdomain Enumeration', 'Google Dorking', 'Certificate Transparency', 'OSINT Framework', 'DNS Zone Transfer']
    },
    {
      id: 'cluster-network',
      title: 'Networking Fundamentals',
      type: 'hub',
      tags: ['networking', 'tcp-ip'],
      spokes: ['TCP 3-Way Handshake', 'UDP Datagrams', 'OSI 7 Layers', 'Subnetting & CIDR', 'Routing & Gateway', 'ICMP Flags']
    },
    {
      id: 'cluster-scanning',
      title: 'Port Scanning & Probing',
      type: 'hub',
      tags: ['nmap', 'scanning'],
      spokes: ['SYN Stealth (-sS)', 'Connect Scan (-sT)', 'UDP Scan (-sU)', 'Service Versioning (-sV)', 'OS Fingerprint (-O)', 'NSE Scripting Engine']
    },
    {
      id: 'cluster-evasion',
      title: 'Firewall & IDS Evasion',
      type: 'hub',
      tags: ['firewall', 'evasion'],
      spokes: ['Packet Fragmentation (-f)', 'Decoy Scanning (-D)', 'Timing Controls (T0-T5)', 'MTU Spoofing', 'ACK Probe Filtering (-sA)', 'Bad Checksums']
    },
    {
      id: 'cluster-enum',
      title: 'Service Enumeration',
      type: 'hub',
      tags: ['enumeration', 'services'],
      spokes: ['FTP Port 21', 'SMB/Samba (139/445)', 'Apache HTTP 80/443', 'MySQL Database 3306', 'SSH Server 22', 'SMTP Mail 25', 'Smbclient', 'Rpcclient Anonymous']
    },
    {
      id: 'cluster-wazuh',
      title: 'Wazuh SIEM & Detection',
      type: 'hub',
      tags: ['wazuh', 'siem'],
      spokes: ['Wazuh Manager', 'Endpoint Agents', 'Custom Decoders', 'XML Alert Rules', 'VirusTotal Integration', 'File Integrity (FIM)', 'Sysmon Event Logs']
    },
    {
      id: 'cluster-ids',
      title: 'Suricata NIDS Engine',
      type: 'hub',
      tags: ['suricata', 'ids'],
      spokes: ['Promiscuous Sniffing', 'Fast.log Alerts', 'Eve.json Stream', 'Emerging Threats Rules', 'Signature Tuning', 'Traffic Mirrors']
    },
    {
      id: 'cluster-setchain',
      title: 'SetChain Security Architecture',
      type: 'hub',
      tags: ['blockchain', 'ai', 'ipfs'],
      spokes: ['AI Anomaly Classifier', 'Hyperledger Fabric', 'IPFS Distributed Log', 'n8n Webhook Engine', 'Tamper-Proof Audit', 'Smart Contracts']
    },
    {
      id: 'cluster-certs',
      title: 'Security Certifications',
      type: 'hub',
      tags: ['certs', 'career'],
      spokes: ['Cisco CCNA Security', 'eJPT Junior Pentester', 'MITRE ATT&CK Matrix', 'SANS IR Methodology', 'TryHackMe Top Rank', 'HackTheBox Proving']
    }
  ];

  // Register Hubs & Concept Spokes
  clusterDefinitions.forEach(function (c) {
    registerNode({
      id: c.id,
      title: c.title,
      url: null,
      type: 'hub',
      radius: 9.5,
      color: COLOR_HUB,
      x: 0, y: 0, vx: 0, vy: 0,
      summary: 'Central knowledge cluster in Karim\'s cybersecurity vault.'
    });

    // Add spoke leaf nodes for dense starburst effect
    c.spokes.forEach(function (spokeName, idx) {
      var spokeId = c.id + '-spoke-' + idx;
      registerNode({
        id: spokeId,
        title: spokeName,
        url: null,
        type: 'concept',
        radius: 3.2,
        color: COLOR_CONCEPT,
        x: 0, y: 0, vx: 0, vy: 0,
        summary: 'Technical concept under ' + c.title
      });
      registerLink(c.id, spokeId, 38 + Math.random() * 22, 0.12);
    });
  });

  // ── 2. Register Actual Blog Pages and link them into Clusters ───
  pages.forEach(function (p) {
    var pNode = registerNode({
      id: p.id,
      title: p.title,
      url: p.url,
      type: 'note',
      radius: 6,
      color: COLOR_NOTE,
      x: 0, y: 0, vx: 0, vy: 0,
      summary: p.summary || ''
    });

    var titleLow = p.title.toLowerCase();

    // Attach to appropriate Hub
    if (titleLow.indexOf('information gathering') !== -1 || titleLow.indexOf('reconnaissance') !== -1) {
      registerLink('cluster-recon', p.id, 55, 0.15);
    } else if (titleLow.indexOf('network primer') !== -1) {
      registerLink('cluster-network', p.id, 55, 0.15);
    } else if (titleLow.indexOf('host discovery') !== -1) {
      registerLink('cluster-scanning', p.id, 55, 0.15);
    } else if (titleLow.indexOf('port scanning') !== -1) {
      registerLink('cluster-scanning', p.id, 55, 0.15);
    } else if (titleLow.indexOf('optimization') !== -1) {
      registerLink('cluster-evasion', p.id, 55, 0.15);
    } else if (titleLow.indexOf('enumeration') !== -1) {
      registerLink('cluster-enum', p.id, 55, 0.15);
    } else if (p.url.indexOf('/wazuh-lab-1') !== -1) {
      registerLink('cluster-ids', p.id, 55, 0.15);
      registerLink('cluster-wazuh', p.id, 65, 0.1);
    } else if (p.url.indexOf('/wazuh-lab-2') !== -1) {
      registerLink('cluster-wazuh', p.id, 55, 0.15);
    } else if (p.url.indexOf('/wazuh-lab-3') !== -1 || titleLow.indexOf('setchain') !== -1) {
      registerLink('cluster-setchain', p.id, 55, 0.15);
      registerLink('cluster-wazuh', p.id, 65, 0.1);
    } else {
      registerLink('cluster-certs', p.id, 60, 0.12);
    }
  });

  // ── 3. Cross-Cluster Inter-Hub Links (Bridge lines) ─────────────
  registerLink('cluster-recon', 'cluster-network', 180, 0.02);
  registerLink('cluster-network', 'cluster-scanning', 160, 0.025);
  registerLink('cluster-scanning', 'cluster-evasion', 140, 0.03);
  registerLink('cluster-scanning', 'cluster-enum', 160, 0.025);
  registerLink('cluster-evasion', 'cluster-ids', 190, 0.018);
  registerLink('cluster-ids', 'cluster-wazuh', 150, 0.03);
  registerLink('cluster-wazuh', 'cluster-setchain', 160, 0.025);
  registerLink('cluster-recon', 'cluster-certs', 200, 0.015);

  if (metaEl) {
    metaEl.textContent = nodes.length + ' nodes · ' + links.length + ' edges';
  }

  // ── 4. Initial Position Setup in a Broad Constellation ──────────
  var width = container.clientWidth || 900;
  var height = container.clientHeight || 680;

  // Arrange hubs evenly around an outer ring
  var hubList = nodes.filter(function(n) { return n.type === 'hub'; });
  var clusterAngleStep = (Math.PI * 2) / hubList.length;

  hubList.forEach(function (h, i) {
    var a = i * clusterAngleStep;
    var dist = Math.min(width, height) * 0.36;
    h.x = (width / 2) + Math.cos(a) * dist;
    h.y = (height / 2) + Math.sin(a) * dist;
  });

  // Place children nearby their connected hubs
  nodes.forEach(function (n) {
    if (n.type !== 'hub') {
      // Find connected hub
      var parent = null;
      for (var k = 0; k < links.length; k++) {
        if (links[k].target === n) { parent = links[k].source; break; }
        if (links[k].source === n) { parent = links[k].target; break; }
      }
      if (parent) {
        var a = Math.random() * Math.PI * 2;
        var d = 30 + Math.random() * 40;
        n.x = parent.x + Math.cos(a) * d;
        n.y = parent.y + Math.sin(a) * d;
      } else {
        n.x = (width / 2) + (Math.random() * 200 - 100);
        n.y = (height / 2) + (Math.random() * 200 - 100);
      }
    }
  });

  // Viewport Transform (Zoom / Pan)
  var view = {
    x: 0,
    y: 0,
    scale: 0.95
  };

  function resize() {
    var dpr = window.devicePixelRatio || 1;
    width = container.clientWidth;
    height = container.clientHeight;
    canvas.width = width * dpr;
    canvas.height = height * dpr;
    ctx.scale(dpr, dpr);
  }
  window.addEventListener('resize', resize);
  resize();

  // Center view on startup
  view.x = (width * (1 - view.scale)) / 2;
  view.y = (height * (1 - view.scale)) / 2;

  // ── 5. Obsidian Physics Engine ──────────────────────────────────
  function tickPhysics() {
    var kRepel = 900;
    var kCenter = 0.008;
    var cx = width / 2;
    var cy = height / 2;

    // Node-Node Repulsion
    for (var i = 0; i < nodes.length; i++) {
      var n1 = nodes[i];
      for (var j = i + 1; j < nodes.length; j++) {
        var n2 = nodes[j];
        var dx = n2.x - n1.x;
        var dy = n2.y - n1.y;
        var d2 = dx * dx + dy * dy || 1;
        var dist = Math.sqrt(d2);

        var maxRange = (n1.type === 'hub' && n2.type === 'hub') ? 350 : 180;
        if (dist < maxRange) {
          var repMult = (n1.type === 'hub' && n2.type === 'hub') ? 3.5 : 1;
          var force = (kRepel * repMult) / d2;
          var fx = (dx / dist) * force;
          var fy = (dy / dist) * force;
          n1.vx -= fx;
          n1.vy -= fy;
          n2.vx += fx;
          n2.vy += fy;
        }
      }

      // Gentle Centering
      n1.vx += (cx - n1.x) * kCenter;
      n1.vy += (cy - n1.y) * kCenter;
    }

    // Link Spring Attraction
    for (var l = 0; l < links.length; l++) {
      var link = links[l];
      var dx = link.target.x - link.source.x;
      var dy = link.target.y - link.source.y;
      var d = Math.sqrt(dx * dx + dy * dy) || 1;
      var diff = (d - link.length) * link.strength;

      var fx = (dx / d) * diff;
      var fy = (dy / d) * diff;

      link.source.vx += fx;
      link.source.vy += fy;
      link.target.vx -= fx;
      link.target.vy -= fy;
    }

    // Position integration & damping
    for (var n = 0; n < nodes.length; n++) {
      var node = nodes[n];
      if (node === draggedNode) continue;
      node.vx *= 0.82;
      node.vy *= 0.82;
      node.x += node.vx;
      node.y += node.vy;
    }
  }

  // ── 6. Rendering (Exact Obsidian Dandelion Aesthetics) ───────────
  var hoveredNode = null;
  var draggedNode = null;
  var searchQuery = '';

  function isConnected(a, b) {
    if (!a || !b) return false;
    for (var i = 0; i < links.length; i++) {
      var l = links[i];
      if ((l.source === a && l.target === b) || (l.source === b && l.target === a)) {
        return true;
      }
    }
    return false;
  }

  function render() {
    tickPhysics();

    ctx.save();
    ctx.clearRect(0, 0, width, height);

    // Apply Viewport transform
    ctx.translate(view.x, view.y);
    ctx.scale(view.scale, view.scale);

    // 1. Draw Edges (Thin, clean hair-lines)
    for (var i = 0; i < links.length; i++) {
      var l = links[i];
      var isHighlighted = hoveredNode && (l.source === hoveredNode || l.target === hoveredNode);

      ctx.beginPath();
      ctx.moveTo(l.source.x, l.source.y);
      ctx.lineTo(l.target.x, l.target.y);

      if (isHighlighted) {
        ctx.strokeStyle = '#4ade80';
        ctx.lineWidth = 1.4;
        ctx.globalAlpha = 0.9;
      } else {
        ctx.strokeStyle = '#3f3f46';
        ctx.lineWidth = 0.75;
        ctx.globalAlpha = hoveredNode ? 0.12 : 0.45;
      }
      ctx.stroke();
    }
    ctx.globalAlpha = 1;

    // 2. Draw Nodes (Solid, clean Obsidian dots)
    for (var j = 0; j < nodes.length; j++) {
      var node = nodes[j];
      var isHovered = (node === hoveredNode);
      var isLinked = hoveredNode && isConnected(hoveredNode, node);
      var isMatch = !searchQuery || (node.title && node.title.toLowerCase().indexOf(searchQuery) !== -1);

      var alpha = 1;
      if (hoveredNode) {
        alpha = (isHovered || isLinked) ? 1 : 0.15;
      } else if (!isMatch) {
        alpha = 0.15;
      }
      ctx.globalAlpha = alpha;

      // Glow on hover or search match
      if (isHovered || (searchQuery && isMatch)) {
        ctx.beginPath();
        ctx.arc(node.x, node.y, node.radius + 5, 0, Math.PI * 2);
        ctx.fillStyle = 'rgba(34, 197, 94, 0.35)';
        ctx.fill();
      }

      // Main Node Circle
      ctx.beginPath();
      ctx.arc(node.x, node.y, node.radius, 0, Math.PI * 2);
      ctx.fillStyle = isHovered ? '#4ade80' : node.color;
      ctx.fill();

      // Subtle edge ring on hub nodes
      if (node.type === 'hub') {
        ctx.strokeStyle = 'rgba(255, 255, 255, 0.25)';
        ctx.lineWidth = 1;
        ctx.stroke();
      }

      // Node Labels: In Obsidian, only Hubs or Hovered nodes display text!
      var showLabel = isHovered || isLinked || (node.type === 'hub') || (searchQuery && isMatch);
      if (showLabel) {
        ctx.font = (node.type === 'hub' ? 'bold 11px' : '500 10px') + ' Inter, sans-serif';
        ctx.fillStyle = isHovered ? '#4ade80' : (node.type === 'hub' ? '#f4f4f5' : '#d4d4d8');
        ctx.textAlign = 'center';
        ctx.textBaseline = 'top';

        // Background shadow for maximum legibility over crossing lines
        ctx.strokeStyle = '#141416';
        ctx.lineWidth = 3;
        ctx.strokeText(node.title, node.x, node.y + node.radius + 4);
        ctx.fillText(node.title, node.x, node.y + node.radius + 4);
      }
    }

    ctx.restore();
    requestAnimationFrame(render);
  }

  // ── 7. User Interaction (Pan, Zoom, Drag, Click) ────────────────
  var isPanning = false;
  var panStart = { x: 0, y: 0 };
  var clickStart = { x: 0, y: 0 };

  function screenToWorld(sx, sy) {
    var rect = canvas.getBoundingClientRect();
    return {
      x: (sx - rect.left - view.x) / view.scale,
      y: (sy - rect.top - view.y) / view.scale
    };
  }

  function findNodeAt(sx, sy) {
    var pt = screenToWorld(sx, sy);
    for (var i = nodes.length - 1; i >= 0; i--) {
      var n = nodes[i];
      var dx = pt.x - n.x;
      var dy = pt.y - n.y;
      var hitRadius = n.radius + 6;
      if (dx * dx + dy * dy <= hitRadius * hitRadius) {
        return n;
      }
    }
    return null;
  }

  canvas.addEventListener('mousemove', function (e) {
    if (draggedNode) {
      var pt = screenToWorld(e.clientX, e.clientY);
      draggedNode.x = pt.x;
      draggedNode.y = pt.y;
      draggedNode.vx = 0;
      draggedNode.vy = 0;
      return;
    }

    if (isPanning) {
      view.x = e.clientX - panStart.x;
      view.y = e.clientY - panStart.y;
      return;
    }

    var target = findNodeAt(e.clientX, e.clientY);
    if (target !== hoveredNode) {
      hoveredNode = target;
      if (hoveredNode) {
        showTooltip(hoveredNode, e.clientX, e.clientY);
      } else {
        tooltip.style.display = 'none';
      }
    } else if (hoveredNode) {
      updateTooltip(e.clientX, e.clientY);
    }
  });

  canvas.addEventListener('mousedown', function (e) {
    clickStart.x = e.clientX;
    clickStart.y = e.clientY;

    var target = findNodeAt(e.clientX, e.clientY);
    if (target) {
      draggedNode = target;
    } else {
      isPanning = true;
      panStart.x = e.clientX - view.x;
      panStart.y = e.clientY - view.y;
    }
  });

  window.addEventListener('mouseup', function () {
    draggedNode = null;
    isPanning = false;
  });

  canvas.addEventListener('click', function (e) {
    var dx = Math.abs(e.clientX - clickStart.x);
    var dy = Math.abs(e.clientY - clickStart.y);
    if (dx > 4 || dy > 4) return; // Dragged, not clicked

    var target = findNodeAt(e.clientX, e.clientY);
    if (target && target.url) {
      window.location.href = target.url;
    }
  });

  // Wheel Zoom
  canvas.addEventListener('wheel', function (e) {
    e.preventDefault();
    var zoomFactor = e.deltaY < 0 ? 1.12 : 0.89;
    var newScale = Math.max(0.3, Math.min(3.5, view.scale * zoomFactor));

    var rect = canvas.getBoundingClientRect();
    var mouseX = e.clientX - rect.left;
    var mouseY = e.clientY - rect.top;

    view.x = mouseX - (mouseX - view.x) * (newScale / view.scale);
    view.y = mouseY - (mouseY - view.y) * (newScale / view.scale);
    view.scale = newScale;
  }, { passive: false });

  // Tooltip
  function showTooltip(n, sx, sy) {
    var typeLabel = n.type === 'hub' ? 'Core Topic' : (n.url ? 'Note' : 'Concept');
    tooltip.innerHTML =
      '<span class="graph-tooltip__tag">' + typeLabel + '</span>' +
      '<div class="graph-tooltip__title">' + n.title + '</div>' +
      (n.summary ? '<div class="graph-tooltip__summary">' + n.summary + '</div>' : '') +
      (n.url ? '<div class="graph-tooltip__hint">Click to read note ➔</div>' : '');

    tooltip.style.display = 'block';
    updateTooltip(sx, sy);
  }

  function updateTooltip(sx, sy) {
    var rect = container.getBoundingClientRect();
    tooltip.style.left = (sx - rect.left) + 'px';
    tooltip.style.top = (sy - rect.top) + 'px';
  }

  // Search input
  searchInput.addEventListener('input', function (e) {
    searchQuery = (e.target.value || '').trim().toLowerCase();
  });

  // Toolbar Actions
  document.getElementById('graph-btn-zoomin').addEventListener('click', function () {
    view.scale = Math.min(3.5, view.scale * 1.25);
  });
  document.getElementById('graph-btn-zoomout').addEventListener('click', function () {
    view.scale = Math.max(0.3, view.scale * 0.8);
  });
  document.getElementById('graph-btn-reset').addEventListener('click', function () {
    view.scale = 0.95;
    view.x = (width * (1 - view.scale)) / 2;
    view.y = (height * (1 - view.scale)) / 2;
  });

  // Start Animation
  render();
})();
</script>
