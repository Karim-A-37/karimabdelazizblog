baseURL = "https://karimabdelazizblog.tech/"
locale  = "en-us"
title   = "Karim's Blog"
theme   = "PaperMod"
paginate = 6

[outputs]
  home = ["HTML", "RSS", "JSON"]

[params]
  author              = "Karim Abdelaziz"
  description         = "Security notes, CTF writeups, and projects by Karim Abdelaziz"
  defaultTheme        = "dark"
  ShowReadingTime     = true
  ShowPostNavLinks    = true
  ShowBreadCrumbs     = true
  ShowCodeCopyButtons = true
  ShowShareButtons    = true
  ShowToc             = true
  TocOpen             = false
  tocHighlight        = true
  images              = ["images/og-default.png"]

  [params.homeInfoParams]
    Title   = "Hey, I'm Karim Abdelaziz"
    Content = "Security notes, CTF writeups, and tech projects."

  [[params.socialIcons]]
    name = "github"
    url  = "https://github.com/Karim-A-37"

  [[params.socialIcons]]
    name = "linkedin"
    url  = "https://linkedin.com/in/karim-abdelaziz-359b63360"

  [[params.socialIcons]]
    name = "hackthebox"
    url  = "https://profile.hackthebox.com/profile/019daf59-087e-71ba-9ae1-58ab43a8a4c8"

  [[params.socialIcons]]
    name = "tryhackme"
    url  = "https://tryhackme.com/p/JaGuar"

  [[params.socialIcons]]
    name = "hackerone"
    url  = "https://hackerone.com/2f4ces"

  [[params.socialIcons]]
    name = "codeforces"
    url  = "https://codeforces.com/profile/2_f4ces"

  [[params.socialIcons]]
    name = "leetcode"
    url  = "https://leetcode.com/u/Karim_A_1117/"

[markup]
  [markup.goldmark]
    [markup.goldmark.renderer]
      unsafe = true
  [markup.highlight]
    style              = "monokai"
    lineNos            = true
    lineNumbersInTable = false
    noClasses          = true
    guessSyntax        = true
  [markup.tableOfContents]
    startLevel = 2
    endLevel   = 3
    ordered    = false

[menu]
  [[menu.main]]
    name   = "Notes"
    url    = "/posts/"
    weight = 5
  [[menu.main]]
    name   = "Projects"
    url    = "/projects/"
    weight = 10
  [[menu.main]]
    name   = "Search"
    url    = "/search/"
    weight = 15
  [[menu.main]]
    name   = "Archive"
    url    = "/archives/"
    weight = 18
  [[menu.main]]
    name   = "Certs"
    url    = "/certs/"
    weight = 19
  [[menu.main]]
    name   = "About"
    url    = "/about/"
    weight = 20

[taxonomies]
  tags   = "tags"
  series = "series"