<script>
(function () {
  var pagesEl = document.getElementById('graph-pages-data');
  if (!pagesEl) return;
  var rawPages = JSON.parse(pagesEl.textContent || '[]');

  var container = document.getElementById('obsidian-graph-wrapper');
  var canvas = document.getElementById('obsidian-canvas');
  var ctx = canvas.getContext('2d');
  var tooltip = document.getElementById('graph-tooltip');
  var searchInput = document.getElementById('graph-search');
  var metaEl = document.getElementById('graph-meta');

  
  var COLOR_MAIN_HUB = '#f4f4f5';      
  var COLOR_NOTE     = '#a1a1aa';      
  var COLOR_LEAF     = '#52525b';      
  var COLOR_HOVER    = '#22c55e';      

  var nodes = [];
  var links = [];
  var nodeMap = {};

  function addNode(node) {
    if (!nodeMap[node.id]) {
      nodes.push(node);
      nodeMap[node.id] = node;
    }
    return nodeMap[node.id];
  }

  function addLink(sourceId, targetId, length, strength) {
    var s = nodeMap[sourceId];
    var t = nodeMap[targetId];
    if (s && t) {
      links.push({
        source: s,
        target: t,
        length: length || 50,
        strength: strength || 0.1
      });
    }
  }

  
  
  var categories = {};

  rawPages.forEach(function (p) {
    var cat = p.category || 'General';
    
    if (cat.toLowerCase() === 'ejpt') cat = 'eJPT';
    if (cat.toLowerCase() === 'wazuh') cat = 'Wazuh SIEM';
    if (cat.toLowerCase() === 'certs') cat = 'Certifications';
    if (cat.toLowerCase() === 'about') cat = 'Profile';

    if (!categories[cat]) {
      categories[cat] = [];
    }
    categories[cat].push(p);
  });

  
  var noteConceptsMap = {
    'Introduction to information gathering': ['WHOIS Protocol', 'DNS Records', 'Passive Footprinting', 'Domain Registrars'],

    'Host Discovery': ['ARP Sweeps', 'ICMP Echo', 'TCP SYN Ping', 'UDP Discovery', 'Netdiscover'],
    'Port Scanning': ['SYN Stealth (-sS)', 'Connect Scan (-sT)', 'UDP Scan (-sU)', 'Service Version (-sV)', 'OS Detection (-O)', 'NSE Scripts'],
    'Scanning Optmization': ['Timing Templates (T0-T5)', 'Packet Fragment (-f)', 'Decoy Scan (-D)', 'MTU Spoofing', 'ACK Probe (-sA)'],
    'Enumeration': ['FTP Port 21', 'SMB/Samba (139/445)', 'Apache HTTP (80/443)', 'MySQL DB (3306)', 'SSH (22)', 'SMTP Mail (25)', 'Smbclient', 'Rpcclient Anonymous'],
    'Lab 1 - Wazuh + Suricata IDS Setup': ['Suricata NIDS Engine', 'Fast.log Alerts', 'Eve.json Stream', 'Promiscuous Mode', 'Ruleset Tuning'],

    'Lab 3 - SetChain: AI + Blockchain Threat Detection': ['AI Anomaly Classifier', 'Hyperledger Fabric', 'IPFS Distributed Log', 'n8n Automation Engine', 'Tamper-Proof Audit'],
    'Certifications': ['Cisco CCNA Security', 'eJPT Junior Pentester', 'MITRE ATT&CK Matrix', 'SANS IR Lifecycle']
  };

  
  var categoryKeys = Object.keys(categories);

  categoryKeys.forEach(function (catName) {
    var catId = 'cat-' + catName.toLowerCase().replace(/[^a-z0-9]/g, '-');

    
    addNode({
      id: catId,
      title: catName,
      url: null,
      type: 'category',
      radius: 12.5,
      color: COLOR_MAIN_HUB,
      x: 0, y: 0, vx: 0, vy: 0,
      summary: 'Main Category: ' + catName + ' (' + categories[catName].length + ' published notes)'
    });

    
    var catNotes = categories[catName];
    catNotes.sort(function (a, b) { return (a.weight || 999) - (b.weight || 999); });

    
    catNotes.forEach(function (p, pIdx) {
      var noteNode = addNode({
        id: p.id,
        title: p.title,
        url: p.url,
        type: 'note',
        category: catName,
        radius: 5.8,
        color: COLOR_NOTE,
        x: 0, y: 0, vx: 0, vy: 0,
        summary: p.summary || ''
      });

      
      addLink(catId, p.id, 55, 0.15);

      
      if (pIdx > 0) {
        addLink(catNotes[pIdx - 1].id, p.id, 45, 0.08);
      }

      
      var concepts = noteConceptsMap[p.title] || [];
      concepts.forEach(function (cName, cIdx) {
        var leafId = p.id + '-c-' + cIdx;
        addNode({
          id: leafId,
          title: cName,
          url: p.url, 
          type: 'concept',
          category: catName,
          radius: 3.2,
          color: COLOR_LEAF,
          x: 0, y: 0, vx: 0, vy: 0,
          summary: 'Core concept in ' + p.title
        });
        
        addLink(p.id, leafId, 28 + (cIdx % 3) * 10, 0.18);
      });
    });
  });

  
  if (categoryKeys.length > 1) {
    for (var i = 0; i < categoryKeys.length; i++) {
      var catAId = 'cat-' + categoryKeys[i].toLowerCase().replace(/[^a-z0-9]/g, '-');
      for (var j = i + 1; j < categoryKeys.length; j++) {
        var catBId = 'cat-' + categoryKeys[j].toLowerCase().replace(/[^a-z0-9]/g, '-');
        addLink(catAId, catBId, 220, 0.015);
      }
    }
  }

  if (metaEl) {
    metaEl.textContent = categoryKeys.length + ' categories · ' + nodes.length + ' nodes';
  }

  
  
  var width = container.clientWidth || 900;
  var height = container.clientHeight || 680;

  var mainHubs = nodes.filter(function (n) { return n.type === 'category'; });
  var hubAngleStep = (Math.PI * 2) / Math.max(1, mainHubs.length);

  mainHubs.forEach(function (h, idx) {
    var a = idx * hubAngleStep;
    var dist = Math.min(width, height) * 0.32;
    h.homeX = (width / 2) + Math.cos(a) * dist;
    h.homeY = (height / 2) + Math.sin(a) * dist;
    h.x = h.homeX;
    h.y = h.homeY;
  });

  
  nodes.forEach(function (n) {
    if (n.type !== 'category') {
      var parent = null;
      for (var k = 0; k < links.length; k++) {
        if (links[k].target === n) { parent = links[k].source; break; }
        if (links[k].source === n) { parent = links[k].target; break; }
      }
      n.parentHub = parent;
      var a = Math.random() * Math.PI * 2;
      var d = (n.type === 'note' ? 45 : 30) + Math.random() * 25;
      n.offsetAngle = a;
      n.offsetDist = d;

      if (parent) {
        n.homeX = (parent.homeX || parent.x) + Math.cos(a) * d;
        n.homeY = (parent.homeY || parent.y) + Math.sin(a) * d;
      } else {
        n.homeX = (width / 2) + (Math.random() * 80 - 40);
        n.homeY = (height / 2) + (Math.random() * 80 - 40);
      }
      n.x = n.homeX;
      n.y = n.homeY;
    }
  });

  
  var view = {
    x: 0,
    y: 0,
    scale: 0.95
  };

  function resize() {
    var dpr = window.devicePixelRatio || 1;
    width = container.clientWidth;
    height = container.clientHeight;
    canvas.width = width * dpr;
    canvas.height = height * dpr;
    ctx.scale(dpr, dpr);
  }
  window.addEventListener('resize', resize);
  resize();

  view.x = (width * (1 - view.scale)) / 2;
  view.y = (height * (1 - view.scale)) / 2;

  
  var simAlpha = 1.0; 

  function tickPhysics() {
    
    if (simAlpha < 0.002) {
      for (var z = 0; z < nodes.length; z++) {
        nodes[z].vx = 0;
        nodes[z].vy = 0;
      }
      return;
    }

    var kRepel = 420;
    var kHome = 0.05; 

    
    for (var h = 0; h < nodes.length; h++) {
      var node = nodes[h];
      if (node === draggedNode) continue;

      if (node.type === 'category') {
        node.vx += (node.homeX - node.x) * kHome * simAlpha;
        node.vy += (node.homeY - node.y) * kHome * simAlpha;
      } else if (node.parentHub) {
        var targetX = node.parentHub.x + Math.cos(node.offsetAngle) * node.offsetDist;
        var targetY = node.parentHub.y + Math.sin(node.offsetAngle) * node.offsetDist;
        node.vx += (targetX - node.x) * 0.07 * simAlpha;
        node.vy += (targetY - node.y) * 0.07 * simAlpha;
      }
    }

    
    for (var i = 0; i < nodes.length; i++) {
      var n1 = nodes[i];
      for (var j = i + 1; j < nodes.length; j++) {
        var n2 = nodes[j];
        var dx = n2.x - n1.x;
        var dy = n2.y - n1.y;
        var minSafeDist = n1.radius + n2.radius + 6;
        var d2 = dx * dx + dy * dy;
        var dist = Math.sqrt(d2) || 1;

        
        if (dist < minSafeDist) {
          var push = (minSafeDist - dist) * 0.45 * simAlpha;
          var nx = dx / dist;
          var ny = dy / dist;
          n1.vx -= nx * push;
          n1.vy -= ny * push;
          n2.vx += nx * push;
          n2.vy += ny * push;
          continue;
        }

        var isBothHubs = (n1.type === 'category' && n2.type === 'category');
        var maxRange = isBothHubs ? 350 : 130;

        if (dist < maxRange) {
          var repMult = isBothHubs ? 2.5 : 0.8;
          var effectiveD2 = Math.max(d2, 500); 
          var force = Math.min((kRepel * repMult) / effectiveD2, 3.2) * simAlpha;
          var fx = (dx / dist) * force;
          var fy = (dy / dist) * force;
          n1.vx -= fx;
          n1.vy -= fy;
          n2.vx += fx;
          n2.vy += fy;
        }
      }
    }

    
    for (var l = 0; l < links.length; l++) {
      var link = links[l];
      var ldx = link.target.x - link.source.x;
      var ldy = link.target.y - link.source.y;
      var ld = Math.sqrt(ldx * ldx + ldy * ldy) || 1;
      var diff = (ld - link.length) * link.strength * simAlpha;
      diff = Math.max(-5, Math.min(5, diff)); 

      var lfx = (ldx / ld) * diff;
      var lfy = (ldy / ld) * diff;

      link.source.vx += lfx;
      link.source.vy += lfy;
      link.target.vx -= lfx;
      link.target.vy -= lfy;
    }

    
    for (var n = 0; n < nodes.length; n++) {
      var nd = nodes[n];
      if (nd === draggedNode) continue;
      nd.vx *= 0.72; 
      nd.vy *= 0.72;

      
      nd.vx = Math.max(-8, Math.min(8, nd.vx));
      nd.vy = Math.max(-8, Math.min(8, nd.vy));

      nd.x += nd.vx;
      nd.y += nd.vy;
    }

    
    if (!draggedNode) {
      simAlpha *= 0.965;
    }
  }

  
  var hoveredNode = null;
  var draggedNode = null;
  var searchQuery = '';

  function isConnected(a, b) {
    if (!a || !b) return false;
    for (var i = 0; i < links.length; i++) {
      var l = links[i];
      if ((l.source === a && l.target === b) || (l.source === b && l.target === a)) {
        return true;
      }
    }
    return false;
  }

  function render() {
    tickPhysics();

    ctx.save();
    ctx.clearRect(0, 0, width, height);

    ctx.translate(view.x, view.y);
    ctx.scale(view.scale, view.scale);

    
    for (var i = 0; i < links.length; i++) {
      var l = links[i];
      var isHighlighted = hoveredNode && (l.source === hoveredNode || l.target === hoveredNode);

      ctx.beginPath();
      ctx.moveTo(l.source.x, l.source.y);
      ctx.lineTo(l.target.x, l.target.y);

      if (isHighlighted) {
        ctx.strokeStyle = '#22c55e';
        ctx.lineWidth = 1.6;
        ctx.globalAlpha = 0.95;
      } else {
        ctx.strokeStyle = '#3f3f46';
        ctx.lineWidth = 0.75;
        ctx.globalAlpha = hoveredNode ? 0.08 : 0.38;
      }
      ctx.stroke();
    }
    ctx.globalAlpha = 1;

    
    for (var j = 0; j < nodes.length; j++) {
      var node = nodes[j];
      var isHovered = (node === hoveredNode);
      var isLinked = hoveredNode && isConnected(hoveredNode, node);
      var isMatch = !searchQuery || (node.title && node.title.toLowerCase().indexOf(searchQuery) !== -1);

      var alpha = 1;
      if (hoveredNode) {
        alpha = (isHovered || isLinked) ? 1 : 0.12;
      } else if (!isMatch) {
        alpha = 0.12;
      }
      ctx.globalAlpha = alpha;

      
      if (isHovered || (searchQuery && isMatch)) {
        ctx.beginPath();
        ctx.arc(node.x, node.y, node.radius + 5, 0, Math.PI * 2);
        ctx.fillStyle = 'rgba(34, 197, 94, 0.35)';
        ctx.fill();
      }

      
      ctx.beginPath();
      ctx.arc(node.x, node.y, node.radius, 0, Math.PI * 2);
      ctx.fillStyle = isHovered ? COLOR_HOVER : node.color;
      ctx.fill();

      
      if (node.type === 'category') {
        ctx.strokeStyle = 'rgba(255, 255, 255, 0.35)';
        ctx.lineWidth = 1.2;
        ctx.stroke();
      }

      
      
      
      var showLabel = isHovered || isLinked || (node.type === 'category') || (searchQuery && isMatch);
      if (showLabel) {
        var isCat = (node.type === 'category');
        ctx.font = (isCat ? 'bold 12px' : '500 10px') + ' Inter, sans-serif';
        ctx.fillStyle = isHovered ? '#22c55e' : (isCat ? '#ffffff' : '#d4d4d8');
        ctx.textAlign = 'center';
        ctx.textBaseline = 'top';

        
        ctx.strokeStyle = '#141416';
        ctx.lineWidth = 3;
        ctx.strokeText(node.title, node.x, node.y + node.radius + 4);
        ctx.fillText(node.title, node.x, node.y + node.radius + 4);
      }
    }

    ctx.restore();
    requestAnimationFrame(render);
  }

  
  var isPanning = false;
  var panStart = { x: 0, y: 0 };
  var clickStart = { x: 0, y: 0 };

  function screenToWorld(sx, sy) {
    var rect = canvas.getBoundingClientRect();
    return {
      x: (sx - rect.left - view.x) / view.scale,
      y: (sy - rect.top - view.y) / view.scale
    };
  }

  function findNodeAt(sx, sy) {
    var pt = screenToWorld(sx, sy);
    for (var i = nodes.length - 1; i >= 0; i--) {
      var n = nodes[i];
      var dx = pt.x - n.x;
      var dy = pt.y - n.y;
      var hitRadius = n.radius + 6;
      if (dx * dx + dy * dy <= hitRadius * hitRadius) {
        return n;
      }
    }
    return null;
  }

  canvas.addEventListener('mousemove', function (e) {
    if (draggedNode) {
      var pt = screenToWorld(e.clientX, e.clientY);
      draggedNode.x = pt.x;
      draggedNode.y = pt.y;
      draggedNode.vx = 0;
      draggedNode.vy = 0;
      simAlpha = Math.max(simAlpha, 0.35); 
      return;
    }

    if (isPanning) {
      view.x = e.clientX - panStart.x;
      view.y = e.clientY - panStart.y;
      return;
    }

    var target = findNodeAt(e.clientX, e.clientY);
    if (target !== hoveredNode) {
      hoveredNode = target;
      if (hoveredNode) {
        showTooltip(hoveredNode, e.clientX, e.clientY);
      } else {
        tooltip.style.display = 'none';
      }
    } else if (hoveredNode) {
      updateTooltip(e.clientX, e.clientY);
    }
  });

  canvas.addEventListener('mousedown', function (e) {
    clickStart.x = e.clientX;
    clickStart.y = e.clientY;

    var target = findNodeAt(e.clientX, e.clientY);
    if (target) {
      draggedNode = target;
      simAlpha = Math.max(simAlpha, 0.35);
    } else {
      isPanning = true;
      panStart.x = e.clientX - view.x;
      panStart.y = e.clientY - view.y;
    }
  });

  window.addEventListener('mouseup', function () {
    if (draggedNode) {
      
      simAlpha = 0.45;
    }
    draggedNode = null;
    isPanning = false;
  });

  canvas.addEventListener('click', function (e) {
    var dx = Math.abs(e.clientX - clickStart.x);
    var dy = Math.abs(e.clientY - clickStart.y);
    if (dx > 4 || dy > 4) return;

    var target = findNodeAt(e.clientX, e.clientY);
    if (target && target.url) {
      window.location.href = target.url;
    }
  });

  
  canvas.addEventListener('wheel', function (e) {
    e.preventDefault();
    var zoomFactor = e.deltaY < 0 ? 1.12 : 0.89;
    var newScale = Math.max(0.3, Math.min(3.5, view.scale * zoomFactor));

    var rect = canvas.getBoundingClientRect();
    var mouseX = e.clientX - rect.left;
    var mouseY = e.clientY - rect.top;

    view.x = mouseX - (mouseX - view.x) * (newScale / view.scale);
    view.y = mouseY - (mouseY - view.y) * (newScale / view.scale);
    view.scale = newScale;
  }, { passive: false });

  
  function showTooltip(n, sx, sy) {
    var typeLabel = n.type === 'category' ? 'Main Category' : (n.type === 'note' ? 'Note' : 'Concept');
    tooltip.innerHTML =
      '<span class="graph-tooltip__tag">' + typeLabel + '</span>' +
      '<div class="graph-tooltip__title">' + n.title + '</div>' +
      (n.summary ? '<div class="graph-tooltip__summary">' + n.summary + '</div>' : '') +
      (n.url ? '<div class="graph-tooltip__hint">Click to open note ➔</div>' : '');

    tooltip.style.display = 'block';
    updateTooltip(sx, sy);
  }

  function updateTooltip(sx, sy) {
    var rect = container.getBoundingClientRect();
    tooltip.style.left = (sx - rect.left) + 'px';
    tooltip.style.top = (sy - rect.top) + 'px';
  }

  
  searchInput.addEventListener('input', function (e) {
    searchQuery = (e.target.value || '').trim().toLowerCase();
    simAlpha = Math.max(simAlpha, 0.25);
  });

  
  document.getElementById('graph-btn-zoomin').addEventListener('click', function () {
    view.scale = Math.min(3.5, view.scale * 1.25);
  });
  document.getElementById('graph-btn-zoomout').addEventListener('click', function () {
    view.scale = Math.max(0.3, view.scale * 0.8);
  });
  document.getElementById('graph-btn-reset').addEventListener('click', function () {
    view.scale = 0.95;
    view.x = (width * (1 - view.scale)) / 2;
    view.y = (height * (1 - view.scale)) / 2;
    nodes.forEach(function (n) {
      n.x = n.homeX;
      n.y = n.homeY;
      n.vx = 0;
      n.vy = 0;
    });
    simAlpha = 0.6;
  });

  render();
})();
</script>

(function () {
  var toc = document.getElementById('TableOfContents');
  if (!toc) return;

  var mainDetails = document.querySelector('.toc > details');
  if (mainDetails && window.innerWidth >= 1280) mainDetails.open = true;

   
  Array.from(toc.querySelectorAll('ul ul')).forEach(function (ul) {
    var parentLi = ul.parentElement;
    if (!parentLi || parentLi.tagName !== 'LI') return;
    var directLink = parentLi.querySelector(':scope > a');
    if (!directLink) return;
    var det = document.createElement('details');
    var sum = document.createElement('summary');
    sum.appendChild(directLink.cloneNode(true));
    det.appendChild(sum);
    det.appendChild(ul);
    directLink.replaceWith(det);
  });

   
  var headings = Array.from(document.querySelectorAll('h2[id], h3[id]'));
  if (!headings.length) return;
  var links = Array.from(toc.querySelectorAll('a[href^="#"]'));
  var cur = { link: null, heading: null };

  function activate(heading) {
    if (cur.link)    cur.link.classList.remove('toc-active');
    if (cur.heading) cur.heading.classList.remove('heading-active');
    cur.heading = heading || null;
    cur.link = null;
    if (!heading) return;
    heading.classList.add('heading-active');
    for (var i = 0; i < links.length; i++) {
      var frag = decodeURIComponent((links[i].getAttribute('href') || '').replace(/^#/, ''));
      if (frag === heading.id) { cur.link = links[i]; break; }
    }
    if (cur.link) {
      cur.link.classList.add('toc-active');
      var parentDet = cur.link.closest('#TableOfContents details');
      if (parentDet) parentDet.open = true;
      var panel = document.querySelector('.toc');
      if (panel && window.innerWidth >= 1280) {
        panel.scrollTop = Math.max(0, cur.link.offsetTop - panel.clientHeight / 2);
      }
    }
  }

  var lastHeading;
  function onScroll() {
    var threshold = window.scrollY + Math.min(140, window.innerHeight * 0.3);
    var found = null;
    for (var i = 0; i < headings.length; i++) {
      if (headings[i].getBoundingClientRect().top + window.scrollY <= threshold) {
        found = headings[i];
      }
    }
    if (found !== lastHeading) { lastHeading = found; activate(found); }
  }
  window.addEventListener('scroll', onScroll, { passive: true });
  onScroll();
})();
</script>

<script>
    document.querySelectorAll('pre > code').forEach((codeblock) => {
        const container = codeblock.parentNode.parentNode;

        const copybutton = document.createElement('button');
        copybutton.classList.add('copy-code');
        copybutton.innerHTML = 'copy';

        function copyingDone() {
            copybutton.innerHTML = 'copied!';
            setTimeout(() => {
                copybutton.innerHTML = 'copy';
            }, 2000);
        }

        copybutton.addEventListener('click', (cb) => {
            if ('clipboard' in navigator) {
                navigator.clipboard.writeText(codeblock.textContent);
                copyingDone();
                return;
            }

            const range = document.createRange();
            range.selectNodeContents(codeblock);
            const selection = window.getSelection();
            selection.removeAllRanges();
            selection.addRange(range);
            try {
                document.execCommand('copy');
                copyingDone();
            } catch (e) { };
            selection.removeRange(range);
        });

        if (container.classList.contains("highlight")) {
            container.appendChild(copybutton);
        } else if (container.parentNode.firstChild == container) {
            
        } else if (codeblock.parentNode.parentNode.parentNode.parentNode.parentNode.nodeName == "TABLE") {
            
            codeblock.parentNode.parentNode.parentNode.parentNode.parentNode.appendChild(copybutton);
        } else {
