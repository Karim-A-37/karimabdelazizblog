  70%  { box-shadow: 0 0 0 10px rgba(34,197,94,0); }

<script>
 
document.addEventListener('click', function(e) {
  var btn = e.target.closest('#theme-toggle');
  if (!btn) return;
  btn.classList.remove('ka-pulsing');
  void btn.offsetWidth;
  btn.classList.add('ka-pulsing');
  btn.addEventListener('animationend', function() {
    btn.classList.remove('ka-pulsing');
  }, { once: true });
});

 
document.addEventListener('DOMContentLoaded', function () {
  var logoLink = document.querySelector('.logo > a');
  if (!logoLink || document.getElementById('ka-chain-svg')) return;

  var ns = 'http://www.w3.org/2000/svg';

   
  var st = document.createElement('style');
  st.textContent =
    '@keyframes ka-katana-hang {' +
      '0%,100%{ transform:rotate(-14deg); }' +
      '50%    { transform:rotate(14deg);  }' +
    '}';
  document.head.appendChild(st);

   
  var svg = document.createElementNS(ns, 'svg');
  svg.id  = 'ka-chain-svg';
  svg.setAttribute('viewBox','0 0 160 30');
  svg.setAttribute('preserveAspectRatio','none');

   
  var defs = document.createElementNS(ns, 'defs');
  defs.innerHTML =
    '<linearGradient id="kbg" x1="0" y1="0" x2="0" y2="1">' +
      '<stop offset="0%" stop-color="#b9ffd0"/>' +
      '<stop offset="100%" stop-color="#22c55e" stop-opacity="0"/>' +
    '</linearGradient>' +
    '<filter id="kglow" x="-80%" y="-80%" width="260%" height="260%">' +
      '<feGaussianBlur stdDeviation="0.7" result="b"/>' +
      '<feMerge><feMergeNode in="b"/><feMergeNode in="SourceGraphic"/></feMerge>' +
    '</filter>';
  svg.appendChild(defs);

   
  var chainLine = document.createElementNS(ns, 'line');
  chainLine.setAttribute('x1','0');  chainLine.setAttribute('y1','3');
  chainLine.setAttribute('x2','160'); chainLine.setAttribute('y2','3');
  chainLine.setAttribute('stroke','rgba(34,197,94,0.3)');
  chainLine.setAttribute('stroke-width','0.8');
  chainLine.setAttribute('stroke-dasharray','4 3');
  svg.appendChild(chainLine);

   
  for (var d = 0; d <= 160; d += 8) {
    var dot = document.createElementNS(ns, 'circle');
    dot.setAttribute('cx', d); dot.setAttribute('cy','3');
    dot.setAttribute('r','0.9');
    dot.setAttribute('fill','rgba(34,197,94,0.45)');
    svg.appendChild(dot);
  }

   
  var xpos = [5, 27, 50, 80, 110, 133, 155];
  xpos.forEach(function(px, i) {
    var delay = (i * 0.25).toFixed(2);
    var g = document.createElementNS(ns, 'g');
    g.setAttribute('style',
      'transform-box:fill-box;' +
      'transform-origin:' + px + 'px 3px;' +
      'animation:ka-katana-hang 2.6s ease-in-out ' + delay + 's infinite;'
    );

     
    var cord = document.createElementNS(ns, 'line');
    cord.setAttribute('x1',px); cord.setAttribute('y1','3');
    cord.setAttribute('x2',px); cord.setAttribute('y2','7');
    cord.setAttribute('stroke','rgba(34,197,94,0.5)');
    cord.setAttribute('stroke-width','0.7');
    g.appendChild(cord);

     
    var h = document.createElementNS(ns, 'rect');
    h.setAttribute('x',px-1.8); h.setAttribute('y','7');
    h.setAttribute('width','3.6'); h.setAttribute('height','5');
    h.setAttribute('rx','1'); h.setAttribute('fill','#15803d');
    g.appendChild(h);

     
    var gu = document.createElementNS(ns, 'ellipse');
    gu.setAttribute('cx',px); gu.setAttribute('cy','12');
    gu.setAttribute('rx','4'); gu.setAttribute('ry','1.5');
    gu.setAttribute('fill','#22c55e');
    g.appendChild(gu);

     
    var bl = document.createElementNS(ns, 'polygon');
    bl.setAttribute('points',
      (px-1.1)+',13 '+(px+1.1)+',13 '+px+',26'
    );
    bl.setAttribute('fill','url(#kbg)');
    bl.setAttribute('filter','url(#kglow)');
    g.appendChild(bl);

     
    var dw = document.createElementNS(ns, 'line');
    dw.setAttribute('x1',px-1.8); dw.setAttribute('y1','9');
    dw.setAttribute('x2',px+1.8); dw.setAttribute('y2','11');
    dw.setAttribute('stroke','#4ade80'); dw.setAttribute('stroke-width','0.5'); dw.setAttribute('opacity','0.6');
    g.appendChild(dw);

    svg.appendChild(g);
  });

   
  var row = document.createElement('span');
  row.className = 'ka-katana-chain-row';
  row.appendChild(svg);
  logoLink.parentNode.insertBefore(row, logoLink.nextSibling);
});
</script>

(function () {
  var toc = document.getElementById('TableOfContents');
  if (!toc) return;

  var mainDetails = document.querySelector('.toc > details');
  if (mainDetails && window.innerWidth >= 1280) mainDetails.open = true;

   
  Array.from(toc.querySelectorAll('ul ul')).forEach(function (ul) {
    var parentLi = ul.parentElement;
    if (!parentLi || parentLi.tagName !== 'LI') return;
    var directLink = parentLi.querySelector(':scope > a');
    if (!directLink) return;
    var det = document.createElement('details');
    var sum = document.createElement('summary');
    sum.appendChild(directLink.cloneNode(true));
    det.appendChild(sum);
    det.appendChild(ul);
    directLink.replaceWith(det);
  });

   
  var headings = Array.from(document.querySelectorAll('h2[id], h3[id]'));
  if (!headings.length) return;
  var links = Array.from(toc.querySelectorAll('a[href^="#"]'));
  var cur = { link: null, heading: null };

  function activate(heading) {
    if (cur.link)    cur.link.classList.remove('toc-active');
    if (cur.heading) cur.heading.classList.remove('heading-active');
    cur.heading = heading || null;
    cur.link = null;
    if (!heading) return;
    heading.classList.add('heading-active');
    for (var i = 0; i < links.length; i++) {
      var frag = decodeURIComponent((links[i].getAttribute('href') || '').replace(/^#/, ''));
      if (frag === heading.id) { cur.link = links[i]; break; }
    }
    if (cur.link) {
      cur.link.classList.add('toc-active');
      var parentDet = cur.link.closest('#TableOfContents details');
      if (parentDet) parentDet.open = true;
      var panel = document.querySelector('.toc');
      if (panel && window.innerWidth >= 1280) {
        panel.scrollTop = Math.max(0, cur.link.offsetTop - panel.clientHeight / 2);
      }
    }
  }

  var lastHeading;
  function onScroll() {
    var threshold = window.scrollY + Math.min(140, window.innerHeight * 0.3);
    var found = null;
    for (var i = 0; i < headings.length; i++) {
      if (headings[i].getBoundingClientRect().top + window.scrollY <= threshold) {
        found = headings[i];
      }
    }
    if (found !== lastHeading) { lastHeading = found; activate(found); }
  }
  window.addEventListener('scroll', onScroll, { passive: true });
  onScroll();
})();
</script>


<script>
    let menu = document.getElementById('menu');
    if (menu) {
        
        const scrollPosition = localStorage.getItem("menu-scroll-position");
        if (scrollPosition) {
            menu.scrollLeft = parseInt(scrollPosition, 10);
        }
        
        menu.onscroll = function () {
            localStorage.setItem("menu-scroll-position", menu.scrollLeft);
        }
    }

    document.querySelectorAll('a[href^="#"]').forEach(anchor => {
        anchor.addEventListener("click", function (e) {
            e.preventDefault();
            var id = this.getAttribute("href").substr(1);
            if (!window.matchMedia('(prefers-reduced-motion: reduce)').matches) {
                document.querySelector(`[id='${decodeURIComponent(id)}']`).scrollIntoView({
                    behavior: "smooth"
                });
            } else {
                document.querySelector(`[id='${decodeURIComponent(id)}']`).scrollIntoView();
            }
            if (id === "top") {
                history.replaceState(null, null, " ");
            } else {
                history.pushState(null, null, `#${id}`);
            }
        });
    });

</script>
<script>
    var toplink = document.getElementById("top-link");
    window.onscroll = function () {
        const scrollThreshold = window.innerHeight;
        if (document.body.scrollTop > scrollThreshold || document.documentElement.scrollTop > scrollThreshold) {
            toplink.classList.remove("hidden");
        } else {
            toplink.classList.add("hidden");
        }
    };

</script>
<script>
    document.getElementById("theme-toggle").addEventListener("click", () => {
        const html = document.querySelector("html");
        if (html.dataset.theme === "dark") {
            html.dataset.theme = 'light';
            localStorage.setItem("pref-theme", 'light');
        } else {
            html.dataset.theme = 'dark';
            localStorage.setItem("pref-theme", 'dark');
        }
    })
