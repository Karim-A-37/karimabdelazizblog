<style>
 
.ka-chain-wrap {
  pointer-events: none;
  position: absolute;
  top: 100%;
  left: 0;
  width: 100%;
  height: 80px;
  z-index: 20;
  overflow: visible;
}

 
.ka-chain-wire {
  position: absolute;
  top: 0;
  left: 0;
  right: 0;
  height: 1px;
  background: linear-gradient(
    90deg,
    transparent 0%,
    rgba(34,197,94,0.5) 10%,
    rgba(34,197,94,0.35) 50%,
    rgba(34,197,94,0.5) 90%,
    transparent 100%
  );
}

 
.ka-pend {
  position: absolute;
  top: 0;
  width: 20px;
  height: 70px;
  transform-origin: 50% 0;
  animation: ka-sway 2.4s ease-in-out infinite alternate;
}

 
.ka-pend:nth-child(1)  { animation-delay:  0.00s; left:  6%; }
.ka-pend:nth-child(2)  { animation-delay: -0.28s; left: 20%; }
.ka-pend:nth-child(3)  { animation-delay: -0.55s; left: 35%; }
.ka-pend:nth-child(4)  { animation-delay: -0.82s; left: 50%; }
.ka-pend:nth-child(5)  { animation-delay: -1.10s; left: 65%; }
.ka-pend:nth-child(6)  { animation-delay: -1.38s; left: 80%; }
.ka-pend:nth-child(7)  { animation-delay: -0.70s; left: 93%; }

@keyframes ka-sway {
  0%   { transform: rotate(-11deg); }
  100% { transform: rotate( 11deg); }
}

 
.ka-rope {
  position: absolute;
  top: 0;
  left: 50%;
  width: 1px;
  height: 12px;
  background: rgba(34,197,94,0.5);
  transform: translateX(-50%);
}

 
.ka-pend svg {
  position: absolute;
  top: 10px;
  left: 50%;
  transform: translateX(-50%);
  width: 18px;
  height: 56px;
  overflow: visible;
  filter: drop-shadow(0 0 3px rgba(34,197,94,0.55));
  opacity: 0.85;
}

 
#theme-toggle { transition: transform 0.2s ease; }
#theme-toggle:active { transform: scale(0.88); }
@keyframes ka-shield-pulse {
  0%   { box-shadow: 0 0 0 0    rgba(34,197,94,0.55); }
  70%  { box-shadow: 0 0 0 10px rgba(34,197,94,0); }
  100% { box-shadow: 0 0 0 0    rgba(34,197,94,0); }
}
#theme-toggle.ka-pulsing {
  animation: ka-shield-pulse 0.5s ease;
  border-radius: 6px;
}
</style>

<script>
 
document.addEventListener('click', function(e) {
  var btn = e.target.closest('#theme-toggle');

  btn.classList.remove('ka-pulsing');

  btn.classList.add('ka-pulsing');
  btn.addEventListener('animationend', function() {
    btn.classList.remove('ka-pulsing');

});

        '<rect x="7.5" y="2" width="5" height="16" rx="2" fill="#15803d"/>',
         
        '<line x1="7.5" y1="6"  x2="12.5" y2="8"  stroke="#4ade80" stroke-width="0.8" opacity="0.7"/>',
        '<line x1="7.5" y1="10" x2="12.5" y2="12" stroke="#4ade80" stroke-width="0.8" opacity="0.7"/>',

      '</svg>'
    ].join('');
  }

   
  var wrap = document.createElement('div');
  wrap.id = 'ka-chain-wrap';
  wrap.className = 'ka-chain-wrap';
  wrap.setAttribute('aria-hidden', 'true');

   
  var wire = document.createElement('div');
  wire.className = 'ka-chain-wire';
  wrap.appendChild(wire);

   
  for (var i = 0; i < 7; i++) {
    var pend = document.createElement('div');
    pend.className = 'ka-pend';
    var rope = document.createElement('div');
    rope.className = 'ka-rope';
    pend.appendChild(rope);
    pend.innerHTML += makeSwordSVG();
    wrap.appendChild(pend);
  }

  logo.appendChild(wrap);
});
</script>

(function () {
  var toc = document.getElementById('TableOfContents');
  if (!toc) return;

  var mainDetails = document.querySelector('.toc > details');
  if (mainDetails && window.innerWidth >= 1280) mainDetails.open = true;

   
  Array.from(toc.querySelectorAll('ul ul')).forEach(function (ul) {
    var parentLi = ul.parentElement;
    if (!parentLi || parentLi.tagName !== 'LI') return;
    var directLink = parentLi.querySelector(':scope > a');
    if (!directLink) return;
    var det = document.createElement('details');
    var sum = document.createElement('summary');
    sum.appendChild(directLink.cloneNode(true));
    det.appendChild(sum);
    det.appendChild(ul);
    directLink.replaceWith(det);
  });

   
  var headings = Array.from(document.querySelectorAll('h2[id], h3[id]'));
  if (!headings.length) return;
  var links = Array.from(toc.querySelectorAll('a[href^="#"]'));
  var cur = { link: null, heading: null };

  function activate(heading) {
    if (cur.link)    cur.link.classList.remove('toc-active');
    if (cur.heading) cur.heading.classList.remove('heading-active');
    cur.heading = heading || null;
    cur.link = null;
    if (!heading) return;
    heading.classList.add('heading-active');
    for (var i = 0; i < links.length; i++) {
      var frag = decodeURIComponent((links[i].getAttribute('href') || '').replace(/^#/, ''));
      if (frag === heading.id) { cur.link = links[i]; break; }
    }
    if (cur.link) {
      cur.link.classList.add('toc-active');
      var parentDet = cur.link.closest('#TableOfContents details');
      if (parentDet) parentDet.open = true;
      var panel = document.querySelector('.toc');
      if (panel && window.innerWidth >= 1280) {
        panel.scrollTop = Math.max(0, cur.link.offsetTop - panel.clientHeight / 2);
      }
    }
  }

  var lastHeading;
  function onScroll() {
    var threshold = window.scrollY + Math.min(140, window.innerHeight * 0.3);
    var found = null;
    for (var i = 0; i < headings.length; i++) {
      if (headings[i].getBoundingClientRect().top + window.scrollY <= threshold) {
        found = headings[i];
      }
    }
    if (found !== lastHeading) { lastHeading = found; activate(found); }
  }
  window.addEventListener('scroll', onScroll, { passive: true });
  onScroll();
})();
</script>


<script>
    let menu = document.getElementById('menu');
    if (menu) {
        
        const scrollPosition = localStorage.getItem("menu-scroll-position");
        if (scrollPosition) {
            menu.scrollLeft = parseInt(scrollPosition, 10);
        }
        
        menu.onscroll = function () {
            localStorage.setItem("menu-scroll-position", menu.scrollLeft);
        }
    }

    document.querySelectorAll('a[href^="#"]').forEach(anchor => {
        anchor.addEventListener("click", function (e) {
            e.preventDefault();
            var id = this.getAttribute("href").substr(1);
            if (!window.matchMedia('(prefers-reduced-motion: reduce)').matches) {
                document.querySelector(`[id='${decodeURIComponent(id)}']`).scrollIntoView({
                    behavior: "smooth"
                });
            } else {
                document.querySelector(`[id='${decodeURIComponent(id)}']`).scrollIntoView();
            }
            if (id === "top") {
                history.replaceState(null, null, " ");
            } else {
                history.pushState(null, null, `#${id}`);
            }
        });
    });

</script>
<script>
    var toplink = document.getElementById("top-link");
    window.onscroll = function () {
        const scrollThreshold = window.innerHeight;
        if (document.body.scrollTop > scrollThreshold || document.documentElement.scrollTop > scrollThreshold) {
            toplink.classList.remove("hidden");
        } else {
            toplink.classList.add("hidden");
        }
    };

</script>
<script>
    document.getElementById("theme-toggle").addEventListener("click", () => {
        const html = document.querySelector("html");
        if (html.dataset.theme === "dark") {
            html.dataset.theme = 'light';
            localStorage.setItem("pref-theme", 'light');
        } else {
            html.dataset.theme = 'dark';
            localStorage.setItem("pref-theme", 'dark');
        }
    })
